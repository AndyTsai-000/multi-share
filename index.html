<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一鍵分享</title>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --ink: #1d2129; --sub: #6b7280; --line: #e3e5e8;
  --accent: #2563eb; --accent-ink: #fff; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
  --soft: #eef2ff; --soft-line: #c7d2fe; --soft-ink: #1e40af; --hint: #f1f2f4;
  --warn-bg: #fef3c7; --warn-ink: #78350f; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --panel: #1b1e25; --ink: #e8eaed; --sub: #9aa1ab; --line: #2c313a;
    --accent: #4f7df5; --soft: #1e2a4a; --soft-line: #34477a; --soft-ink: #b9cbff; --hint: #232731;
    --warn-bg: #3a2e10; --warn-ink: #f5d58a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.5 "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 14px; }
button:hover { border-color: var(--sub); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: .45; cursor: default; filter: none; }
button.link { border: 0; background: none; color: var(--sub); padding: 4px 6px; }
button.link:hover { color: var(--ink); }
button.danger { color: var(--danger); }
input, textarea, select { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); width: 100%; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--soft-line); border-color: var(--accent); }
textarea { resize: vertical; min-height: 150px; }
label.field { display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px; font-weight: 600; }

.app { display: grid; grid-template-columns: 270px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 16px 16px 10px; }
aside h1 { font-size: 19px; margin: 0 0 12px; }
aside .new { width: 100%; }
.posts { overflow: auto; padding: 4px 10px 16px; flex: 1; }
.group-title { font-size: 12px; color: var(--sub); margin: 14px 6px 6px; font-weight: 600; }
.post-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 9px 10px; margin-bottom: 4px; border-radius: 10px; }
.post-item:hover { background: var(--bg); border-color: transparent; }
.post-item.active { background: var(--soft); border-color: var(--soft-line); }
.post-item .when { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; gap: 6px; }
.post-item .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--hint); color: var(--sub); white-space: nowrap; }
.pill.due { background: var(--warn-bg); color: var(--warn-ink); }
.pill.done { background: #dcfce7; color: #166534; }
aside footer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; }
aside footer button { width: 100%; }

main { overflow: auto; min-height: 0; }
.editor { max-width: 760px; margin: 0 auto; padding: 22px 24px 110px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-weight: 400; color: var(--sub); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.empty { color: var(--sub); font-size: 14px; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--sub); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 12px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--hint); border: 1px solid var(--line); }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tag { position: absolute; left: 5px; bottom: 5px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.thumb .x { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; line-height: 26px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 99px; padding: 5px 12px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px rgba(150,150,150,.45); }
.chip small { color: var(--sub); }
.chip.cat { font-size: 13px; padding: 3px 10px; color: var(--sub); }
.when-row .chip { min-width: 70px; justify-content: center; }
.when-row input { width: auto; }
.pick-label { font-size: 13px; color: var(--sub); margin: 14px 0 6px; font-weight: 600; }
.chip.past { opacity: .35; pointer-events: none; text-decoration: line-through; }
/* 「其他日期／自訂時間」：整顆按鈕都能點，點下去打開系統的選擇器 */
.pick-input { position: relative; cursor: pointer; }
.pick-input input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; border: 0; pointer-events: none; }
.when-line, .warn-line { margin: 12px 0 0; font-size: 14px; }
.warn-line { color: var(--danger); }

.bar { position: fixed; left: 270px; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); }
.bar .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.bar .grow { flex: 1; color: var(--sub); font-size: 14px; }
.bar .primary { padding: 10px 22px; font-size: 16px; }

.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border-radius: 14px; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 14px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.t-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.t-row .name { flex: 1; min-width: 0; }
.t-row .name small { color: var(--sub); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; color: #fff; white-space: nowrap; font-weight: 600; }
.t-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 12px; }
.t-form .full { grid-column: 1 / -1; }
.hint-s { font-size: 13px; color: var(--sub); }
.text-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.text-head label.field { margin: 0; }
.ai-btn { border-radius: 99px; padding: 4px 12px; font-size: 13px; border-color: var(--accent); color: var(--accent); }
.ai-vers { display: grid; gap: 10px; margin-top: 14px; }
.ai-ver { border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
.ai-ver .row { margin-top: 10px; justify-content: flex-end; white-space: normal; }
.ai-wait { text-align: center; padding: 24px 0; color: var(--sub); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

.send .progress { height: 6px; background: var(--hint); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.send .progress div { height: 100%; background: var(--accent); transition: width .2s; }
.send .who { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.send .who b { font-size: 20px; }
.count { color: var(--sub); font-size: 13px; margin-left: auto; font-weight: 400; }
.send .hint { background: var(--hint); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
.send .hint.warn { background: var(--warn-bg); color: var(--warn-ink); }
.steps { display: grid; gap: 8px; }
.step { display: flex; align-items: center; gap: 10px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; flex: none; font-size: 14px; }
.step button { flex: 1; text-align: left; padding: 11px 14px; font-size: 15px; }
.step button.did, .chip.did { border-color: var(--ok); color: var(--ok); }
.send .nav { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
.send .nav .primary { flex: 1; padding: 11px; font-size: 16px; }
.preview { white-space: pre-wrap; font-size: 13px; color: var(--sub); max-height: 90px; overflow: auto; border-left: 3px solid var(--line); padding-left: 10px; margin-top: 8px; }
.done-list { margin: 8px 0 0; padding: 0; list-style: none; }
.done-list li { padding: 5px 0; display: flex; gap: 8px; align-items: center; }

.auto-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.auto-head { font-weight: 600; margin-bottom: 8px; }
.auto-head small { font-weight: 400; color: var(--sub); margin-left: 6px; font-size: 13px; }
.job-row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 14px; flex-wrap: wrap; }
.job-row .err { color: var(--danger); font-size: 13px; flex-basis: 100%; padding-left: 22px; }
.story-frames { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.story-frame { flex: none; width: 200px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: #16181d; border: 1px solid var(--line); display: grid; place-items: center; }
.story-frame img, .story-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 760px) { .story-frame { width: 150px; } }
.ig-sum { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag-stage { position: relative; background: var(--hint); border-radius: 10px; overflow: hidden; max-height: 42vh; display: flex; justify-content: center; }
.tag-stage img { display: block; max-width: 100%; max-height: 42vh; cursor: crosshair; }
.tag-pin { position: absolute; transform: translate(-50%, 8px); background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 3px 4px 3px 9px; border-radius: 6px; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.tag-pin::before { content: ''; position: absolute; left: 50%; top: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top: 0; border-bottom-color: rgba(0,0,0,.78); }
.tag-pin button { border: 0; background: none; color: #fff; padding: 0 3px; font-size: 12px; }
.tag-dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.3); pointer-events: none; }
.place-new summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 10px; }
.stepper { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; }
.stepper .st { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 4px; text-align: left; color: var(--sub); }
.stepper .st-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--hint); font-weight: 700; font-size: 13px; flex: none; }
.stepper .st-t { display: flex; flex-direction: column; font-size: 14px; line-height: 1.25; }
.stepper .st-t small { font-size: 12px; color: var(--sub); }
.stepper .st.done .st-n { background: var(--soft); color: var(--accent); }
.stepper .st.on { color: var(--ink); font-weight: 600; }
.stepper .st.on .st-n { background: var(--accent); color: #fff; }
.stepper .st-line { flex: 1; height: 2px; background: var(--line); min-width: 12px; }
.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card { text-align: left; padding: 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.mode-card:hover { border-color: var(--soft-line); }
.mode-card.on { border-color: var(--accent); background: var(--soft); }
.mode-title { font-size: 17px; font-weight: 700; }
.mode-lead { margin: 0; color: var(--ink); font-size: 14px; }
.mode-where { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
.mode-card ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 4px; }
.mode-card li::before { margin-right: 6px; }
.mode-card li.ok::before { content: '✅'; }
.mode-card li.no::before { content: '❌'; }
.mode-card li.no { color: var(--sub); }
.mode-foot { margin: 6px 0 0; font-size: 12px; color: var(--sub); }
.mode-pick { margin-top: auto; padding-top: 8px; font-weight: 600; color: var(--accent); font-size: 14px; }
.step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.set-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.set-row + .set-row { border-top: 1px dashed var(--line); }
.set-row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
@media (max-width: 760px) {
  .mode-cards { grid-template-columns: 1fr; }
  .stepper .st-t small { display: none; }
  .stepper .st-t { font-size: 13px; }
}
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 34vh; }
  aside header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  aside h1 { margin: 0; font-size: 17px; flex: 1; }
  aside .new { width: auto; }
  aside footer { grid-template-columns: 1fr 1fr 1fr; padding: 8px 12px; }
  aside footer button { font-size: 13px; padding: 6px 4px; }
  .bar { left: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .grow { display: none; }
  .bar .primary { flex: 1; padding: 10px; font-size: 15px; }
  .bar button { white-space: nowrap; }
  .bar .link { padding: 4px 2px; }
  .send .nav { flex-wrap: wrap; }
  .send .nav .primary { flex-basis: 100%; order: -1; }
  .send .nav #sSkip { margin-left: auto; }
  .editor { padding: 14px 16px 110px; }
  .t-form { grid-template-columns: 1fr; }
  .modal { padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>一鍵分享</h1>
      <button class="primary new" id="newPost">＋ 新增貼文</button>
    </header>
    <div class="posts" id="postList"></div>
    <footer>
      <button id="openTargets">管理發送對象</button>
      <button id="openBackup">備份／搬資料</button>
      <button id="openAuto">⚡ 自動發帳號</button>
    </footer>
  </aside>
  <main>
    <div class="editor" id="editor"></div>
  </main>
</div>
<div class="bar"><div class="inner">
  <span class="grow" id="barInfo"></span>
  <button class="link danger" id="delPost">刪除這則</button>
  <button id="lineBatch" hidden>LINE 分批</button>
  <button class="primary" id="autoSend" hidden>⚡ 自動發</button>
  <button class="primary" id="startSend">開始發送</button>
</div></div>

<div class="modal-bg" id="targetsModal"><div class="modal">
  <h3>發送對象 <button class="link" data-close>關閉</button></h3>
  <div id="targetList"></div>
  <div id="targetForm"></div>
</div></div>

<div class="modal-bg" id="igOptsModal"><div class="modal" style="width:min(720px,100%)">
  <h3>IG 貼文設定 <button class="link" id="igOptsClose">完成</button></h3>
  <div id="igOptsBody"></div>
</div></div>

<div class="modal-bg" id="storyModal"><div class="modal" style="width:min(760px,100%)">
  <h3>確認限動畫面 <button class="link" id="storyClose">關閉</button></h3>
  <div id="storyBody"></div>
</div></div>

<div class="modal-bg" id="aiModal"><div class="modal">
  <h3>✨ AI 幫我寫文案 <button class="link" data-close>關閉</button></h3>
  <div id="aiBody"></div>
</div></div>

<div class="modal-bg" id="autoModal"><div class="modal">
  <h3>⚡ 自動發帳號 <button class="link" data-close>關閉</button></h3>
  <div id="autoBody"></div>
</div></div>

<div class="modal-bg" id="backupModal"><div class="modal">
  <h3>備份／搬資料 <button class="link" data-close>關閉</button></h3>
  <p class="hint-s" style="margin-top:0">資料只存在這個瀏覽器裡。清除瀏覽器資料、換電腦或換手機之前，先匯出備份。</p>
  <div class="steps">
    <div class="step"><span class="n">↓</span><button id="exportBtn">匯出備份檔（發送對象＋貼文文字）</button></div>
    <div class="step"><span class="n">↑</span><button id="importBtn">匯入備份檔</button></div>
  </div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <p class="hint-s">圖片和影片檔案太大，不會放進備份檔。只想把發送對象給同事的話，匯出後傳給他匯入就好。</p>
</div></div>

<div class="modal-bg" id="sendModal"><div class="modal send" id="sendBox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ===== 裝置判斷 =====
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const canShareFiles = files => { try { return !!navigator.canShare && navigator.canShare({ files }); } catch { return false; } };

// ===== 各種發送對象 =====
// open(text, link, t)：要開的網址；mobileShare：手機上用系統「分享」把圖片影片丟過去
const enc = encodeURIComponent;
const TYPES = {
  line: {
    label: 'LINE', color: '#06c755', kind: '訊息',
    open: (text, link) => IS_MOBILE || !link
      ? `https://line.me/R/share?text=${enc(text || link)}`
      : `https://social-plugins.line.me/lineit/share?url=${enc(link)}&text=${enc(text.replace(link, '').trim())}`,
    hint: n => IS_MOBILE
      ? `LINE 會打開分享畫面，勾選「${n}」（可以一次勾很多個），按傳送。有圖片影片就用「分享圖片影片」選 LINE。`
      : `會打開 LINE 的分享視窗（第一次要登入 LINE），勾選「${n}」後傳送。電腦版只能帶文字和連結，圖片請用手機或另外傳。`,
  },
  fbgroup: {
    label: 'FB 社團', color: '#1877f2', kind: '貼文', needUrl: true, placeholder: 'https://www.facebook.com/groups/…',
    open: (text, link, t) => t.url,
    hint: () => IS_MOBILE ? '點「留個言⋯」，長按貼上文字。圖片影片用「分享圖片影片」選 Facebook → 分享到社團。' : '點「留個言⋯」，按 Ctrl+V（Mac 是 ⌘V）貼上文字；圖片可以先「複製圖片」再貼上，或下載後拖進去。',
  },
  fb: {
    label: 'FB 動態', color: '#1877f2', kind: '貼文',
    open: (text, link) => link ? `https://www.facebook.com/sharer/sharer.php?u=${enc(link)}` : 'https://www.facebook.com/',
    hint: () => '文字已經複製好，在發文框貼上。有連結的話會自動帶出連結預覽。',
  },
  fbstory: {
    label: 'FB 限動', color: '#0866ff', kind: '限動', needMedia: true,
    open: () => 'https://www.facebook.com/stories/create',
    hint: () => IS_MOBILE ? '用「分享圖片影片」選 Facebook →「限時動態」。' : '選「建立相片限時動態」，把下載的檔案選進去。',
  },
  ig: {

// ===== 儲存：瀏覽器的 IndexedDB（設定＋媒體檔）=====
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('multi-share', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('media'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode), req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = tx.onabort = () => rej(tx.error);
    });
  };
  return {
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    put: (s, k, v) => run(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
  };
})();
let dbOk = true;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!dbOk) return;
    DB.put('kv', 'state', JSON.parse(JSON.stringify(S))).catch(() => toast('存檔失敗，瀏覽器可能不允許儲存'));
  }, 300);
}
async function mediaBlob(m) {
  if (!blobs[m.id] && dbOk) blobs[m.id] = await DB.get('media', m.id).catch(() => null);
  return blobs[m.id];
}
async function mediaUrl(m) {
  if (urls[m.id]) return urls[m.id];
  const b = await mediaBlob(m);
  return b ? (urls[m.id] = URL.createObjectURL(b)) : '';
}
function dropMedia(m) {
  if (urls[m.id]) URL.revokeObjectURL(urls[m.id]);
  delete urls[m.id]; delete blobs[m.id];
  if (dbOk) DB.del('media', m.id).catch(() => {});
}

function toast(msg) {

function fmtTime(iso) {
  if (!iso) return '立即';
  const d = new Date(iso), now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day0(d) - day0(now)) / 864e5);
  const dayLabel = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === -1 ? '昨天' : `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）`;
  return `${dayLabel} ${hm}`;
}
// 排程用的日期、時間按鈕（今天起 7 天＋常用時段；也可以選其他日期、自訂時間）
const QUICK_TIMES = ['08:00', '09:00', '10:00', '12:00', '15:00', '18:00', '20:00', '21:00'];
function schedulePicker(p) {
  const [date, hm] = p.time.split('T');
  const now = new Date(), today = localInput(now).slice(0, 10);
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    return { v: localInput(d).slice(0, 10), label: i === 0 ? '今天' : i === 1 ? '明天' : i === 2 ? '後天' : `${d.getMonth() + 1}/${d.getDate()}`, wk: WEEK[d.getDay()] };
  });
  const nowHm = localInput(now).slice(11);
  const isPast = new Date(p.time) <= now;
  const otherDay = !days.some(d => d.v === date);
  const otherTime = !QUICK_TIMES.includes(hm);
  return `
    <div class="pick-label">日期</div>
    <div class="chips">${days.map(d => `<button class="chip ${d.v === date ? 'on' : ''}" data-day="${d.v}">${d.label}<small>（${d.wk}）</small></button>`).join('')}
      <label class="chip ${otherDay ? 'on' : ''} pick-input">${otherDay ? esc(fmtTime(p.time).split(' ')[0]) : '其他日期'}<input type="date" id="pickDate" value="${date}" min="${today}"></label></div>
    <div class="pick-label">時間</div>
    <div class="chips">${QUICK_TIMES.map(t => `<button class="chip ${t === hm ? 'on' : ''} ${date === today && t <= nowHm ? 'past' : ''}" data-hm="${t}">${t}</button>`).join('')}
      <label class="chip ${otherTime ? 'on' : ''} pick-input">${otherTime ? hm : '自訂時間'}<input type="time" id="pickTime" value="${hm}"></label></div>
    <p class="${isPast ? 'warn-line' : 'when-line'}">${isPast ? '⚠️ 這個時間已經過了，請選之後的時間' : `📅 將在 <b>${esc(fmtTime(p.time))}</b> 發出`}</p>`;
}
function localInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function postTargets(p) { return p.mode === 'auto' ? [] : p.targets.map(id => S.targets.find(t => t.id === id)).filter(Boolean); }
function postStatus(p) {

  if (p.time && new Date(p.time) <= new Date()) return { cls: 'due', text: n ? `已發 ${n}/${ts.length}` : '時間到了' };

  ed.querySelectorAll('[data-t]').forEach(x => x.onclick = () => {
    const id = x.dataset.t;
    p.targets = p.targets.includes(id) ? p.targets.filter(y => y !== id) : [...p.targets, id];
    save(); renderEditor(); renderList();
  });
  ed.querySelectorAll('[data-plat]').forEach(x => x.onclick = () => {
    const pl = PLATFORMS.find(y => y.id === x.dataset.plat);
    p.targets = S.targets.filter(t => t.type in pl.types).map(t => t.id);
    save(); renderEditor(); renderList();
  });
  ed.querySelectorAll('[data-cat]').forEach(x => x.onclick = () => {
    const c = x.dataset.cat;
    p.targets = c === '*' ? S.targets.map(t => t.id) : c ? S.targets.filter(t => t.cat === c).map(t => t.id) : [];
    save(); renderEditor(); renderList();
  });
  if (p.step !== 3) return;

  renderThumbs();
  const refreshSettings = () => { const c = $('#editor .card:last-child'); if (c && !p.serverPost) { renderEditorSettings(p); } };
  $('#aiOpen').onclick = () => openAi(p);
  $('#text').oninput = e => { p.text = e.target.value; save(); renderList(); renderBar(); refreshSettings(); };
  $('#link').oninput = e => { p.link = e.target.value; save(); renderList(); renderBar(); refreshSettings(); };
  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click();

  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(p, e.dataTransfer.files); };
  ed.querySelectorAll('[data-when]').forEach(x => x.onclick = () => {
    if (x.dataset.when === 'now') p.time = null;
    else if (!p.time) { const d = new Date(Date.now() + 3600e3); d.setMinutes(0, 0, 0); p.time = localInput(d); askNotify(); }
    p.reminded = false; save(); renderAll();
  });
  // 排程：點日期、點時間；也可以用「其他日期／自訂時間」
  const setWhen = (date, time) => {
    const [d0, t0] = p.time.split('T');

    save(); renderEditor(); renderList();
  };
  ed.querySelectorAll('[data-day]').forEach(x => x.onclick = () => setWhen(x.dataset.day, null));
  ed.querySelectorAll('[data-hm]').forEach(x => x.onclick = () => setWhen(null, x.dataset.hm));
  ed.querySelectorAll('.pick-input').forEach(l => l.onclick = e => { e.preventDefault(); const i = l.querySelector('input'); try { i.showPicker(); } catch { i.focus(); i.click(); } });
  if ($('#pickDate')) $('#pickDate').onchange = e => e.target.value && setWhen(e.target.value, null);
  if ($('#pickTime')) $('#pickTime').onchange = e => e.target.value && setWhen(null, e.target.value);
  if ($('#ics')) $('#ics').onclick = () => downloadIcs(p);
  bindAutoStatus(p);
  bindSettings(p);
}

async function renderThumbs() {
  const p = active(), box = $('#thumbs'); if (!box) return;
  box.innerHTML = p.media.map((m, i) => `<div class="thumb" data-i="${i}">
    <span class="tag">${isVideo(m) ? '影片' : /gif/.test(m.type) ? 'GIF' : ''}</span>
    <button class="x" data-i="${i}" title="移除">✕</button></div>`).join('');
  box.querySelectorAll('.tag').forEach(t => { if (!t.textContent) t.remove(); });
  box.querySelectorAll('.x').forEach(b => b.onclick = () => {
    const m = p.media[+b.dataset.i];
    p.media = p.media.filter(x => x !== m); dropMedia(m); save(); renderThumbs(); renderBar(); renderList(); if (p.step === 3) renderEditorSettings(p);
  });
  for (const [i, m] of p.media.entries()) {
    const src = await mediaUrl(m), cell = box.querySelector(`.thumb[data-i="${i}"]`);
    if (!cell || !src) continue;
    const el = document.createElement(isVideo(m) ? 'video' : 'img');
    el.src = isVideo(m) ? src + '#t=0.5' : src;
    if (isVideo(m)) { el.muted = true; el.preload = 'metadata'; el.playsInline = true; }
    cell.prepend(el);
  }
}
async function addFiles(p, files) {
  for (const f of files) {
    if (!/^(image|video)\//.test(f.type)) { toast(`「${f.name}」不是圖片或影片`); continue; }
    const m = { id: uid(), name: f.name, type: f.type };
    blobs[m.id] = f;
    if (dbOk) {
      try { await DB.put('media', m.id, f); }
      catch { toast('檔案太大，瀏覽器存不下；重新整理後會不見'); }
    }
    p.media.push(m);
  }
  save(); renderThumbs(); renderBar(); renderList();
  if (active() === p && p.step === 3) renderEditorSettings(p);
}

function renderBar() {
  const p = active(), btn = $('#startSend');
  $('#delPost').hidden = !p;
  if (!p) { btn.disabled = true; $('#lineBatch').hidden = true; $('#barInfo').textContent = ''; return; }
  const ts = postTargets(p), n = ts.length, left = ts.filter(t => !p.done?.[t.id]).length;
  const empty = !fullText(p) && !p.media.length;
  const lineLeft = lineTargets(p).filter(t => !p.done?.[t.id]).length;
  $('#lineBatch').hidden = !(lineLeft >= 2 && !empty);
  $('#lineBatch').textContent = `LINE 分批（${lineLeft}）`;
  btn.disabled = !n || empty;
  const autoN = autoSelected(p).length;
  const last = p.step === 3;
  $('#autoSend').hidden = !last || !autoN || !!p.serverPost;
  $('#autoSend').disabled = empty;
  $('#autoSend').textContent = p.time ? `⚡ 排程自動發（${autoN}）` : `⚡ 立即自動發（${autoN}）`;
  btn.hidden = !last || p.mode === 'auto';
  if (!last) $('#lineBatch').hidden = true;
  btn.textContent = left && left < n ? `繼續發送（剩 ${left} 個）` : n ? `開始發送（${n} 個）` : '開始發送';
  $('#barInfo').textContent = p.step === 1 ? '① 先選發送方式' : p.step === 2 ? '② 選好要發到哪裡，按「下一步」' : empty ? '先輸入文字或加入圖片影片' : p.time ? `排程：${fmtTime(p.time)}` : '';
}
$('#delPost').onclick = () => {

// ===== 行事曆提醒（.ics）=====
function downloadIcs(p) {
  const d = new Date(p.time), pad = n => String(n).padStart(2, '0');
  const stamp = x => `${x.getUTCFullYear()}${pad(x.getUTCMonth() + 1)}${pad(x.getUTCDate())}T${pad(x.getUTCHours())}${pad(x.getUTCMinutes())}00Z`;
  const icsText = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const title = (p.text.trim().split('\n')[0] || p.link || '發文').slice(0, 40);
  const names = postTargets(p).map(t => t.name).join('、');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//multi-share//TW', 'BEGIN:VEVENT',
    `UID:${p.id}@multi-share`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(d)}`, `DTEND:${stamp(new Date(+d + 15 * 60e3))}`,
    `SUMMARY:${icsText('發文提醒：' + title)}`,
    `DESCRIPTION:${icsText(`要發到：${names}\n打開一鍵分享：${location.href.split('#')[0]}`)}`,
    `URL:${location.href.split('#')[0]}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsText('發文提醒：' + title)}`, 'TRIGGER:PT0M', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  saveFile(new Blob([ics], { type: 'text/calendar' }), '發文提醒.ics');
  toast('打開下載的檔案，就會加進行事曆');
}
function saveFile(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function askNotify() { try { if (Notification.permission === 'default') Notification.requestPermission(); } catch {} }

  const sync = () => { e.name = $('#tName').value; e.cat = $('#tCat').value; if ($('#tUrl')) e.url = $('#tUrl').value; };
  // 換類型時，名稱若還是空的或是上一個類型的預設名稱，就換成新類型的預設名稱
  const setType = type => {

  $('#targetForm').querySelectorAll('[data-plat]').forEach(b => b.onclick = () => {

function bindBulk() {
  if ($('#bmLink')) {
    const href = bookmarkletHref();

// 每行：「名稱」或「名稱 網址」或只有網址；FB 社團網址統一成 https://www.facebook.com/groups/<id>/
function parseBulkLine(line, defType) {
  line = line.trim();
  if (!line) return null;
  const m = line.match(/https?:\/\/\S+/i);
  if (!m) return { name: line.slice(0, 80), type: defType, url: '' };
  let url = m[0], name = line.replace(m[0], '').replace(/\s+/g, ' ').trim();
  const g = url.match(/facebook\.com\/groups\/([^/?#\s]+)/i);
  if (g) url = `https://www.facebook.com/groups/${g[1]}/`;
  return { name: (name || url).slice(0, 80), type: g ? 'fbgroup' : 'other', url };
}
function addBulk(text, defType, cat) {
  let added = 0, skipped = 0;
  for (const line of text.split(/\r?\n/)) {
    const t = parseBulkLine(line, defType);
    if (!t) continue;
    const dup = S.targets.some(x => t.url ? x.url === t.url : x.type === t.type && x.name === t.name);
    if (dup) { skipped++; continue; }
    S.targets.push({ id: uid(), cat, ...t });
    added++;
  }
  return { added, skipped };
}
// 書籤程式：在 FB「你的社團」頁面自動捲到底，抓出社團名稱和網址，顯示在畫面上讓你複製
function fbImporter() {
  const SKIP = /^(joins|feed|discover|create|notifications|search|your_groups|category|invites|requests|learning_content)$/i;
  const collect = () => {
    const m = new Map();
    document.querySelectorAll('a[href*="/groups/"]').forEach(a => {
      let u; try { u = new URL(a.href, location.href); } catch { return; }
      const seg = u.pathname.split('/').filter(Boolean), i = seg.indexOf('groups'), id = seg[i + 1];
      if (i < 0 || !id || SKIP.test(id) || seg.length > i + 2) return;
      const key = `https://www.facebook.com/groups/${id}/`;
      const name = (a.innerText || a.getAttribute('aria-label') || '').trim().split('\n')[0].trim();
      if (!name || name.length > 100 || /^(查看社團|檢視社團|View group|前往社團|Visit group)$/i.test(name)) return;
      if (!m.has(key)) m.set(key, name);
    });
    return m;
  };
  if (!/(^|\.)facebook\.com$/.test(location.hostname)) { alert('請在 Facebook 網站上按這個書籤'); return; }
  if (!/^\/groups\/joins/.test(location.pathname)) {
    if (confirm('要先打開「你的社團」頁面嗎？\n打開後請再按一次這個書籤。')) location.href = 'https://www.facebook.com/groups/joins/';
    return;
  }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;z-index:2147483647;top:20px;right:20px;width:360px;background:#fff;color:#111;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:16px;font:14px/1.5 system-ui,sans-serif';
  box.textContent = '正在往下捲動，載入你所有的社團⋯';
  document.body.appendChild(box);
  (async () => {
    let last = 0, same = 0;
    for (let k = 0; k < 80 && same < 3; k++) {
      window.scrollTo(0, document.documentElement.scrollHeight);
      await new Promise(r => setTimeout(r, 1300));
      const h = document.documentElement.scrollHeight;
      same = h === last ? same + 1 : 0; last = h;
      box.textContent = `正在往下捲動⋯已找到 ${collect().size} 個社團`;
    }
    const found = collect();
    const text = [...found].map(([url, name]) => `${name}\t${url}`).join('\n');
    box.innerHTML = '';
    const h = document.createElement('b'); h.textContent = `找到 ${found.size} 個社團`;
    const ta = document.createElement('textarea'); ta.value = text; ta.readOnly = true;
    ta.style.cssText = 'width:100%;height:180px;margin:8px 0;font-size:12px;border:1px solid #ccc;border-radius:6px;padding:6px;box-sizing:border-box';
    const btn = document.createElement('button'); btn.textContent = '複製';
    btn.style.cssText = 'background:#1877f2;color:#fff;border:0;border-radius:6px;padding:8px 18px;font-weight:600;cursor:pointer;margin-right:8px';
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(text); } catch { ta.select(); document.execCommand('copy'); }
      btn.textContent = '已複製 ✓，回一鍵分享貼上';
    };
    const close = document.createElement('button'); close.textContent = '關閉';
    close.style.cssText = 'background:#eee;border:0;border-radius:6px;padding:8px 14px;cursor:pointer';
    close.onclick = () => box.remove();
    box.append(h, ta, btn, close);
  })();
}

// ===== 媒體：複製、下載、手機分享 =====
async function mediaFiles(p) {
  const out = [];
  for (const m of p.media) { const b = await mediaBlob(m); if (b) out.push(new File([b], m.name, { type: m.type })); }
  return out;
}
// 剪貼簿只收 PNG；把轉檔的 Promise 直接交給 ClipboardItem，Mac 的 Safari 才不會擋
async function copyImage(m) {
  const png = (async () => {
    const bmp = await createImageBitmap(await mediaBlob(m));
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    return new Promise(r => c.toBlob(r, 'image/png'));
  })();
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
}
async function downloadAll(p) {
  for (const m of p.media) {
    const b = await mediaBlob(m); if (!b) continue;
    saveFile(b, m.name);
    await new Promise(r => setTimeout(r, 400));
  }
}
// iPhone 的 Safari 規定「分享」要在按下的當下呼叫，中間不能先等讀檔，所以檔案要事先準備好
const shareCache = {};
function prepareShare(p) {
  const key = p.id + ':' + p.media.map(m => m.id).join(',');
  if (!shareCache[key]) { shareCache[key] = { files: null }; mediaFiles(p).then(f => shareCache[key].files = f); }
  return shareCache[key];
}
async function shareMedia(p, withText = true) {
  const files = prepareShare(p).files, text = fullText(p);
  if (!files) { toast('檔案準備中，請再按一次'); return; }
  const data = files.length ? { files } : {};
  if (withText && text) data.text = text;
  const copy = text ? navigator.clipboard.writeText(text).catch(() => {}) : null;
  await navigator.share(data);
  await copy;
}

async function doAct(act, t, btn) {
  const p = send.post, ty = TYPES[t.type], text = fullText(p);
  try {
    if (act === 'open') {
      const url = ty.open(text, p.link.trim(), t);
      // 複製和開視窗都要在按下的當下開始（不能先 await），不然手機會擋
      const copy = text ? navigator.clipboard.writeText(text).catch(() => {}) : null;
      const w = window.open(url, '_blank');
      await copy;
      if (!w && !IS_MOBILE) toast('視窗被瀏覽器擋住了，請允許這個網站開新視窗');
      else toast(text ? '已開啟，文字已複製' : '已開啟');
    } else if (act === 'text') {
      await navigator.clipboard.writeText(text);
      toast('文字已複製');
    } else if (act === 'share') {
      await shareMedia(p, t.type !== 'ig' && t.type !== 'igstory');
      if (text) toast('文字也複製好了，需要時長按貼上');
    } else if (act === 'copyimg') {
      await copyImage(p.media.find(m => !isVideo(m)));
      toast('圖片已複製，到發文框貼上');
    } else if (act === 'download') {
      await downloadAll(p);

}
function next(auto) {

}
function closeSend() {

  renderAll();
}

// ===== LINE 分批 =====
// LINE 分享一次能勾的人數有限：照名單一批一批傳，批與批之間休息，避免被判定洗版
function lineTargets(p) { return postTargets(p).filter(t => t.type === 'line'); }
function openBatch(p) {
  batch = { post: p, picked: {}, timer: null };
  p.reminded = true; save();
  renderBatch(); $('#sendModal').classList.add('open');
}
$('#lineBatch').onclick = () => active() && openBatch(active());
function beep() {
  try {
    const ac = new AudioContext(), o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(ac.currentTime + .35);
  } catch {}
}
function renderBatch() {
  const p = batch.post, box = $('#sendBox');
  clearInterval(batch.timer);
  const size = S.batchSize || 15;
  const all = lineTargets(p), left = all.filter(t => !p.done?.[t.id]);
  const total = Math.ceil(all.length / size), no = Math.min(total, Math.floor((all.length - left.length) / size) + 1);
  const progress = `<div class="progress"><div style="width:${(all.length - left.length) / all.length * 100}%"></div></div>`;
  if (!left.length) {

  }
  const group = left.slice(0, size);
  const wait = (p.cooldownUntil || 0) - Date.now();
  if (wait > 0) {
    const fmt = ms => { const sec = Math.ceil(ms / 1000); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };
    box.innerHTML = `${progress}<h3>休息一下 <span class="count">下一批：第 ${no} / ${total} 批</span></h3>
      <div style="text-align:center;font-size:44px;font-weight:700;margin:6px 0" id="bClock">${fmt(wait)}</div>
      <p class="empty" style="text-align:center;margin:0 0 12px">太快連續傳容易被 LINE 判定洗版。時間到會響一聲。</p>
      <div class="hint">下一批：${group.map(t => esc(t.name)).join('、')}</div>
      <div class="nav"><button class="link" id="bStop">先停在這裡</button><button class="link" id="bNow" style="margin-left:auto">不等了，直接下一批</button></div>`;
    $('#bStop').onclick = closeSend;
    $('#bNow').onclick = () => { if (confirm('連續太快傳可能被 LINE 限制，確定不等？')) { p.cooldownUntil = 0; save(); renderBatch(); } };
    batch.timer = setInterval(() => {
      const w = (p.cooldownUntil || 0) - Date.now();
      if (w > 0) { $('#bClock').textContent = fmt(w); return; }
      beep();
      try { if (document.hidden && Notification.permission === 'granted') new Notification('一鍵分享：可以傳下一批了'); } catch {}
      renderBatch();
    }, 500);
    return;
  }
  const hasMedia = p.media.length > 0, shareOk = IS_MOBILE && hasMedia && typeof navigator.share === 'function';
  if (shareOk) prepareShare(p);
  box.innerHTML = `${progress}<h3>LINE 第 ${no} / ${total} 批 <span class="count">這批 ${group.length} 個 · 每批
      <select id="bSize" style="width:auto;padding:1px 4px">${[5, 10, 15, 20].map(n => `<option ${n === size ? 'selected' : ''}>${n}</option>`).join('')}</select></span></h3>
    <div class="hint">按下面的按鈕打開 LINE 分享畫面，勾選這批聊天室後傳送。點名字會複製名字，可以貼到 LINE 的搜尋欄。</div>
    <div class="chips" id="bNames">${group.map(t => `<button class="chip ${batch.picked[t.id] ? 'did' : ''}" data-id="${t.id}">${batch.picked[t.id] ? '✓ ' : ''}${esc(t.name)}</button>`).join('')}</div>
    <div class="steps" style="margin-top:14px">
      <div class="step"><span class="n">↗</span><button data-b="${shareOk ? 'share' : 'open'}">${shareOk ? `分享圖片影片＋文字 → 選 LINE` : '開啟 LINE 分享（已帶入文字）'}</button></div>
    </div>
    ${hasMedia && !IS_MOBILE ? '<p class="hint-s" style="margin:8px 0 0">電腦版 LINE 分享只能帶文字和連結。要連圖片一起傳，請用手機打開這個網頁做分批。</p>' : ''}
    <div class="nav">
      <button class="link" id="bStop">先停在這裡</button>
      <button class="primary" id="bDone">✓ 這批已傳完成</button>
    </div>`;
  $('#bSize').onchange = e => { S.batchSize = +e.target.value; save(); renderBatch(); };
  box.querySelectorAll('#bNames [data-id]').forEach(b => b.onclick = async () => {
    const t = S.targets.find(x => x.id === b.dataset.id);
    try { await navigator.clipboard.writeText(t.name); toast(`已複製「${t.name}」`); } catch {}
    batch.picked[t.id] = true; b.classList.add('did'); b.textContent = '✓ ' + t.name;
  });
  box.querySelector('[data-b]').onclick = async ev => {
    try {
      if (ev.currentTarget.dataset.b === 'share') await shareMedia(p);
      else {
        const copy = fullText(p) ? navigator.clipboard.writeText(fullText(p)).catch(() => {}) : null;
        window.open(TYPES.line.open(fullText(p), p.link.trim()), '_blank');
        await copy;
      }
    } catch (e) { if (e?.name !== 'AbortError') toast('失敗：' + (e?.message || e)); }
  };
  $('#bStop').onclick = closeSend;
  $('#bDone').onclick = () => {
    group.forEach(t => p.done = { ...p.done, [t.id]: true });
    batch.picked = {};
    p.cooldownUntil = left.length > group.length ? Date.now() + COOLDOWN_MS : 0;
    save(); renderAll(); renderBatch();
  };
}

// ===== ⚡ 自動發（伺服器）=====
// 連結的 IG／Threads 帳號由伺服器在時間到時自動發；登入狀態是一組 session，存在這個瀏覽器
const API = 'https://multi-share-api.multi-share-api.workers.dev';
const AUTO_KINDS = [
  { platform: 'ig', kind: 'post', label: 'IG 貼文', color: '#d6249f' },
  { platform: 'ig', kind: 'story', label: 'IG 限動', color: '#e1306c' },
  { platform: 'threads', kind: 'post', label: 'Threads', color: '#111827' },

let session = '', autoAccounts = [];
const serverPosts = {};
async function apiCall(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + session } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { session = ''; autoAccounts = []; if (dbOk) DB.put('kv', 'session', '').catch(() => {}); }
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);

}

}

const AUTO_STATUS = {

function listStatus(p) {

function jobLabel(acc, kind) {

function autoStatusHtml(p) {

// IG 只收 JPEG：圖片一律轉成 JPEG，最長邊縮到 2048
async function toJpeg(blob) {

async function uploadMedia(blob, type) {

async function sendAuto(p, opts, storyBlobs) {

  const btn = $('#autoSend');
  btn.disabled = true;
  try {
    const needMain = opts.some(o => !isStory(o));
    const total = (needMain ? p.media.length : 0) + (storyBlobs ? storyBlobs.length : 0);
    let done = 0;
    const tick = () => { btn.textContent = `上傳中 ${++done}/${total}⋯`; };
    const media = [];
    if (needMain) for (const m of p.media) {
      tick();
      const blob = await mediaBlob(m);
      if (!blob) throw new Error(`找不到「${m.name}」，請重新加入`);
      media.push(isVideo(m) ? await uploadMedia(blob, videoType(m, blob)) : await uploadMedia(await toJpeg(blob), 'image/jpeg'));
    }
    const storyMedia = [];
    if (storyBlobs) for (const [i, b] of storyBlobs.entries()) {
      tick();
      const m = p.media[i];
      storyMedia.push(isVideo(m) ? await uploadMedia(b, videoType(m, b)) : await uploadMedia(b, 'image/jpeg'));
    }
    btn.textContent = '送出中⋯';
    const targets = opts.map(o => isStory(o) && storyMedia.length ? { account: o.account, kind: o.kind, media: storyMedia }
      : o.platform === 'ig' && o.kind === 'post' ? { account: o.account, kind: o.kind, ig: igPayload(p) } : { account: o.account, kind: o.kind });
    const r = await apiCall('/api/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, media, targets, run_at: p.time && !late ? new Date(p.time).getTime() : Date.now() }) });
    p.serverPost = r.id; save();
    serverPosts[r.id] = { status: 'scheduled', run_at: r.run_at, targets: opts.map(o => ({ account: o.account, kind: o.kind })), jobs: [] };
    toast(when === '現在' ? '已送出，大約 1～2 分鐘內發出' : '已排程，時間到會自動發出');
    setTimeout(refreshServerPosts, 8000);
  } catch (e) { toast('自動發失敗：' + e.message); }
  renderAll();
}

const STORY_POS = [['top', '上方'], ['middle', '中間'], ['bottom', '下方'], ['none', '不加文字']];

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawStoryText(g, text, st, W, H) {
  const size = 68, lh = Math.round(size * 1.35), maxW = W - 200, pad = 40;
  g.font = `bold ${size}px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif`;
  const lines = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const ch of [...para]) {
      if (line && g.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch;
    }
    lines.push(line);
  }
  const shown = lines.slice(0, 8);
  if (lines.length > 8) shown[7] = shown[7].slice(0, -1) + '…';
  const boxW = Math.max(...shown.map(l => g.measureText(l).width)) + pad * 2;
  const boxH = shown.length * lh + pad * 2 - (lh - size);
  // IG 限動上下各有一段會被頭像和回覆框蓋住，避開那兩段
  const y = st.pos === 'top' ? 280 : st.pos === 'middle' ? (H - boxH) / 2 : H - boxH - 330;
  const [bg, fg] = { dark: ['rgba(0,0,0,.62)', '#fff'], light: ['rgba(255,255,255,.93)', '#111'], plain: [null, '#fff'] }[st.style] || [null, '#fff'];
  if (bg) { g.fillStyle = bg; roundRectPath(g, (W - boxW) / 2, y, boxW, boxH, 28); g.fill(); }
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'top';
  if (!bg) { g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = 14; }
  shown.forEach((l, i) => g.fillText(l, W / 2, y + pad + i * lh));
  g.shadowBlur = 0;
}
// 1080×1920：背景用同一張圖放大模糊，前面放完整的原圖，再疊文字
async function composeStory(blob, st) {
  const W = 1080, H = 1920, bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#16181d'; g.fillRect(0, 0, W, H);
  const cover = Math.max(W / bmp.width, H / bmp.height);
  if ('filter' in g) {
    g.filter = 'blur(40px) brightness(0.55)';
    g.drawImage(bmp, (W - bmp.width * cover) / 2, (H - bmp.height * cover) / 2, bmp.width * cover, bmp.height * cover);
    g.filter = 'none';
  }
  const fit = Math.min(W / bmp.width, H / bmp.height), w = bmp.width * fit, h = bmp.height * fit;
  g.drawImage(bmp, (W - w) / 2, (H - h) / 2, w, h);
  const text = (st.text || '').trim();
  if (text && st.pos !== 'none') drawStoryText(g, text, st, W, H);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}

      <div class="tag-stage" id="tagStage">
        ${isVideo(m) ? '<div class="hint-s" style="padding:30px;text-align:center">影片不能指定位置，直接在下面輸入帳號就好</div>' : '<img id="tagImg" alt="">'}
        ${isVideo(m) ? '' : tags.map((t, i) => `<span class="tag-pin" style="left:${t.x * 100}%;top:${t.y * 100}%">@${esc(t.username)}<button data-untag="${i}" title="移除">✕</button></span>`).join('')}
        ${igCtx.pending && !isVideo(m) ? `<span class="tag-dot" style="left:${igCtx.pending.x * 100}%;top:${igCtx.pending.y * 100}%"></span>` : ''}
      </div>
      <div class="row" style="margin-top:8px">
        <input id="tagName" placeholder="${isVideo(m) || igCtx.pending ? '要標註的 IG 帳號，例如 friend_01' : '先點照片上的位置'}" style="flex:1;min-width:160px" ${isVideo(m) || igCtx.pending ? '' : 'disabled'}>
        <button id="tagAdd" ${isVideo(m) || igCtx.pending ? '' : 'disabled'}>加入標註</button>
      </div>
      ${isVideo(m) && tags.length ? `<div class="chips" style="margin-top:8px">${tags.map((t, i) => `<span class="chip on">@${esc(t.username)}<button class="link" data-untag="${i}" style="padding:0 0 0 4px">✕</button></span>`).join('')}</div>` : ''}`
      : '<p class="empty">先加入圖片或影片才能標註。</p>'}

    <div class="pick-label">協作者 <small style="font-weight:400">最多 3 位（Instagram 的規定），對方接受後兩邊都會出現這則貼文</small></div>
    <div class="chips">${o.collaborators.map((c, i) => `<span class="chip on">@${esc(c)}<button class="link" data-uncollab="${i}" style="padding:0 0 0 4px">✕</button></span>`).join('')}</div>
    ${o.collaborators.length < 3 ? `<div class="row" style="margin-top:8px"><input id="collabName" placeholder="協作者的 IG 帳號" style="flex:1;min-width:160px"><button id="collabAdd">加入協作者</button></div>` : ''}

    <div class="pick-label">地點</div>
    <div class="chips">
      <button class="chip ${!o.location ? 'on' : ''}" data-place="">不加地點</button>
      ${places.map(x => `<button class="chip ${o.location === x.id ? 'on' : ''}" data-place="${x.id}">📍${esc(x.name)}</button>`).join('')}
    </div>
    <details class="place-new" ${places.length ? '' : 'open'}>
      <summary>＋ 新增常用地點</summary>
      <div class="t-form" style="margin-top:8px">
        <div><label class="field">名稱</label><input id="placeName" placeholder="例：台中門市"></div>
        <div><label class="field">Facebook 地點編號或網址</label><input id="placeId" placeholder="例：110765362279102"></div>
        <div class="full hint-s">Instagram 沒有開放搜尋地點，要用這個地點在 Facebook 上的編號：在 Facebook 搜尋那個地點（例如你的門市粉絲專頁）→ 打開它的頁面 →「關於」→「粉絲專頁資訊公開」裡的<b>粉絲專頁編號</b>，複製貼上。網址裡有一長串數字的話，直接貼網址也可以。設定一次之後就能直接點選。</div>
        <div class="full row" style="justify-content:flex-end"><button class="primary" id="placeSave">儲存地點</button></div>
      </div>
    </details>
    ${places.length ? `<p class="hint-s" style="margin:8px 0 0">${places.map(x => `<button class="link danger" data-unplace="${x.id}" style="padding:0 8px 0 0">刪除「${esc(x.name)}」</button>`).join('')}</p>` : ''}`;

  const box = $('#igOptsBody');
  // 標註
  box.querySelectorAll('[data-cur]').forEach(b => b.onclick = () => { igCtx.cur = +b.dataset.cur; igCtx.pending = null; renderIgOpts(); });
  const img = $('#tagImg');
  if (img && m) {
    img.src = await mediaUrl(m);
    img.onclick = e => {
      const r = img.getBoundingClientRect();
      igCtx.pending = { x: Math.round((e.clientX - r.left) / r.width * 1000) / 1000, y: Math.round((e.clientY - r.top) / r.height * 1000) / 1000 };
      renderIgOpts().then(() => $('#tagName')?.focus());
    };
  }
  const addTag = () => {
    const name = cleanName($('#tagName').value);
    if (!validName(name)) return toast('帳號只能有英文、數字、底線和句點');
    if (tags.some(t => t.username === name)) return toast('這張已經標註過這個人');
    tags.push(isVideo(m) ? { username: name, x: 0.5, y: 0.5 } : { username: name, ...igCtx.pending });
    igCtx.pending = null; save(); renderIgOpts();
  };
  if ($('#tagAdd')) { $('#tagAdd').onclick = addTag; $('#tagName').onkeydown = e => e.key === 'Enter' && addTag(); }
  box.querySelectorAll('[data-untag]').forEach(b => b.onclick = e => { e.stopPropagation(); tags.splice(+b.dataset.untag, 1); save(); renderIgOpts(); });
  // 協作者
  const addCollab = () => {
    const name = cleanName($('#collabName').value);
    if (!validName(name)) return toast('帳號只能有英文、數字、底線和句點');
    if (o.collaborators.includes(name)) return toast('已經加過了');
    o.collaborators.push(name); save(); renderIgOpts();
  };
  if ($('#collabAdd')) { $('#collabAdd').onclick = addCollab; $('#collabName').onkeydown = e => e.key === 'Enter' && addCollab(); }
  box.querySelectorAll('[data-uncollab]').forEach(b => b.onclick = () => { o.collaborators.splice(+b.dataset.uncollab, 1); save(); renderIgOpts(); });
  // 地點
  box.querySelectorAll('[data-place]').forEach(b => b.onclick = () => { o.location = b.dataset.place; save(); renderIgOpts(); });
  box.querySelectorAll('[data-unplace]').forEach(b => b.onclick = () => {
    const x = places.find(pl => pl.id === b.dataset.unplace);
    if (!confirm(`刪除常用地點「${x.name}」？`)) return;
    S.places = places.filter(pl => pl !== x);
    if (o.location === x.id) o.location = '';
    save(); renderIgOpts();
  });
  $('#placeSave').onclick = () => {
    const name = $('#placeName').value.trim();
    const id = ($('#placeId').value.match(/\d{5,25}/) || [])[0];
    if (!name) return toast('請輸入地點名稱');
    if (!id) return toast('找不到編號：要是一串數字，或含有數字編號的網址');
    S.places = [...places.filter(x => x.id !== id), { id, name }];
    o.location = id; save(); renderIgOpts();
  };
}

async function refreshServerPosts() {
  if (!session || !S.posts.some(p => p.serverPost)) return;
  try { const { posts } = await apiCall('/api/posts'); for (const sp of posts) serverPosts[sp.id] = sp; } catch { return; }
  renderList();
  const p = active(), box = $('#autoStatus');
  if (p?.serverPost && box) { box.innerHTML = autoStatusHtml(p); bindAutoStatus(p); }
}

// 帳號連結視窗
async function openAuto() {
  $('#autoModal').classList.add('open');
  $('#autoBody').innerHTML = '<p class="empty">讀取中⋯</p>';
  await loadAccounts();
  renderAuto();
}
$('#openAuto').onclick = openAuto;
function renderAuto() {
  const name = { ig: 'Instagram', threads: 'Threads' }, color = { ig: '#d6249f', threads: '#111827' };
  $('#autoBody').innerHTML = `
    <p class="hint-s" style="margin-top:0">連結後，貼文可以設定時間，由伺服器自動發到 Instagram 和 Threads，網頁和電腦都可以關掉。IG 要是<b>創作者或商業帳號</b>，而且要先被加成「一鍵分享」應用程式的測試人員。</p>
    ${autoAccounts.length ? autoAccounts.map(a => `<div class="t-row"><span class="badge" style="background:${color[a.platform]}">${name[a.platform]}</span>
      <div class="name">@${esc(a.username)}<small>授權到 ${new Date(a.token_expires).toLocaleDateString()}，到期前會自動續期</small></div>
      <button class="link danger" data-unlink="${a.id}">取消連結</button></div>`).join('') : '<p class="empty">還沒有連結任何帳號。</p>'}
    <div class="row" style="margin-top:14px"><button class="primary" data-link="ig">＋ 連結 Instagram</button><button data-link="threads">＋ 連結 Threads</button></div>
    ${session ? '<p class="hint-s" style="margin:14px 0 0"><button class="link" id="autoLogout" style="padding:0">在這台裝置登出</button></p>' : ''}`;
  $('#autoBody').querySelectorAll('[data-link]').forEach(b => b.onclick = () => {
    location.href = `${API}/auth/${b.dataset.link}/start${session ? '?s=' + encodeURIComponent(session) : ''}`;
  });
  $('#autoBody').querySelectorAll('[data-unlink]').forEach(b => b.onclick = async () => {
    if (!confirm('取消連結這個帳號？已排程的自動發會失敗。')) return;
    try { await apiCall('/api/accounts/' + b.dataset.unlink, { method: 'DELETE' }); } catch (e) { toast('失敗：' + e.message); }
    await loadAccounts(); renderAuto(); renderAll();
  });
  if ($('#autoLogout')) $('#autoLogout').onclick = async () => {
    if (!confirm('在這台裝置登出？帳號連結不會被取消，下次按「連結」就能回來。')) return;
    try { await apiCall('/api/logout', { method: 'POST' }); } catch {}
    session = ''; autoAccounts = []; if (dbOk) DB.put('kv', 'session', '').catch(() => {});
    renderAuto(); renderAll();
  };
}

// ===== 排程提醒（網頁開著時）=====
function checkDue() {
  if (send || batch) return;
  const due = S.posts.find(p => p.time && !p.reminded && new Date(p.time) <= new Date() && postTargets(p).length && !postStatus(p).finished);
  if (!due) return;
  beep();
  try { if (Notification.permission === 'granted') new Notification('一鍵分享：發文時間到了', { body: (due.text || due.link || '').slice(0, 80) }); } catch {}
  startSend(due);
}

function renderAll() { renderList(); renderEditor(); }

(async () => {
  try {
    const st = await DB.get('kv', 'state');
    if (st) S = { batchSize: 15, ...st };
    navigator.storage?.persist?.().catch(() => {});
  } catch {
    dbOk = false;
    toast('這個瀏覽器不能儲存資料（可能是無痕模式），關掉後內容會不見');
  }
  S.posts.forEach(p => {
    p.media ||= []; p.done ||= {}; p.targets ||= []; p.auto ||= [];
    // 改版前的貼文：依原本選的對象判斷是全自動還是半自動
    if (p.mode === undefined) p.mode = p.serverPost || (p.auto.length && !p.targets.length) ? 'auto' : p.targets.length ? 'manual' : null;
  });
  // 從 Instagram／Threads 連結回來時，網址後面會帶 #ms_session=... 或 #ms_error=...
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('ms_session') || h.has('ms_error')) history.replaceState(null, '', location.pathname + location.search);
  if (dbOk) session = (await DB.get('kv', 'session').catch(() => '')) || '';
  if (h.get('ms_session')) { session = h.get('ms_session'); if (dbOk) DB.put('kv', 'session', session).catch(() => {}); }
  await loadAccounts();
  if (!active()) S.activeId = S.posts[S.posts.length - 1]?.id || null;
  if (!S.posts.length) newPost(); else renderAll();
  setInterval(() => { checkDue(); if (!send && !batch) renderList(); }, 15e3);
  checkDue();
  refreshServerPosts(); setInterval(refreshServerPosts, 30e3);
  if (h.get('ms_linked')) { toast('已連結 ' + h.get('ms_linked')); openAuto(); }
  if (h.get('ms_error')) alert(h.get('ms_error'));
})();
</script>
</body>
