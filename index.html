<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社群管家</title>
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --ink: #1d2129; --sub: #6b7280; --line: #e3e5e8;
  --accent: #2563eb; --accent-ink: #fff; --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
  --soft: #eef2ff; --soft-line: #c7d2fe; --soft-ink: #1e40af; --hint: #f1f2f4;
  --warn-bg: #fef3c7; --warn-ink: #78350f; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --panel: #1b1e25; --ink: #e8eaed; --sub: #9aa1ab; --line: #2c313a;
    --accent: #4f7df5; --soft: #1e2a4a; --soft-line: #34477a; --soft-ink: #b9cbff; --hint: #232731;
    --warn-bg: #3a2e10; --warn-ink: #f5d58a;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 15px/1.5 "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 14px; }
button:hover { border-color: var(--sub); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: .45; cursor: default; filter: none; }
button.link { border: 0; background: none; color: var(--sub); padding: 4px 6px; }
button.link:hover { color: var(--ink); }
button.danger { color: var(--danger); }
input, textarea, select { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); width: 100%; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--soft-line); border-color: var(--accent); }
textarea { resize: vertical; min-height: 150px; }
label.field { display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px; font-weight: 600; }

.app { display: grid; grid-template-columns: 270px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 16px 16px 10px; }
aside h1 { font-size: 19px; margin: 0 0 12px; }
aside .new { width: 100%; }
.posts { overflow: auto; padding: 4px 10px 16px; flex: 1; }
.group-title { font-size: 12px; color: var(--sub); margin: 14px 6px 6px; font-weight: 600; display: flex; justify-content: space-between; }
.group-title span { font-weight: 400; }
.group-title.warn { color: #e0901a; }
.group-hint { font-size: 11px; color: var(--sub); margin: -4px 6px 6px; }
.pill.unsched { background: rgba(245, 166, 35, .18); color: #e0901a; }
.ver { font-size: 11px; color: var(--sub); text-align: center; opacity: .7; }
.home-link { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.home { max-width: 760px; }
.home-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.home-head h2 { margin: 0; font-size: 18px; }
.home-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 2px; }
.home-item:first-of-type { border-top: 0; }
.home-item .snip { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.home-warn { border-color: rgba(245, 166, 35, .55); }
.home-ok { border-color: #22c55e; background: rgba(34, 197, 94, .1); }
.se-busy { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--soft); color: var(--soft-ink); font-weight: 600; text-align: center; }
.step-nav.bare { border-top: 0; margin-top: 0; padding-top: 0; }
.post-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 9px 10px; margin-bottom: 4px; border-radius: 10px; }
.post-item:hover { background: var(--bg); border-color: transparent; }
.post-item.active { background: var(--soft); border-color: var(--soft-line); }
.post-item .when { font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; gap: 6px; }
.post-item .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--hint); color: var(--sub); white-space: nowrap; }
.pill.due { background: var(--warn-bg); color: var(--warn-ink); }
.pill.done { background: #dcfce7; color: #166534; }
aside footer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; }
aside footer button { width: 100%; }

main { overflow: auto; min-height: 0; }
.editor { max-width: 760px; margin: 0 auto; padding: 22px 24px 110px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-weight: 400; color: var(--sub); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.empty { color: var(--sub); font-size: 14px; }

.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--sub); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-top: 12px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--hint); border: 1px solid var(--line); }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tag { position: absolute; left: 5px; bottom: 5px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 4px; }
.thumb .x { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; line-height: 26px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 99px; padding: 5px 12px; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--soft); border-color: var(--accent); color: var(--soft-ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px rgba(150,150,150,.45); }
.chip small { color: var(--sub); }
.chip.cat { font-size: 13px; padding: 3px 10px; color: var(--sub); }
.when-row .chip { min-width: 70px; justify-content: center; }
.when-row input { width: auto; }
.pick-label { font-size: 13px; color: var(--sub); margin: 14px 0 6px; font-weight: 600; }
.chip.past { opacity: .35; pointer-events: none; text-decoration: line-through; }
/* 「其他日期／自訂時間」：整顆按鈕都能點，點下去打開系統的選擇器 */
.pick-input { position: relative; cursor: pointer; }
.pick-input input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; border: 0; pointer-events: none; }
.when-line, .warn-line { margin: 12px 0 0; font-size: 14px; }
.warn-line { color: var(--danger); }
.phone-note { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.6;
  background: rgba(245, 166, 35, .12); border: 1px solid rgba(245, 166, 35, .55); color: var(--ink); }
.phone-note b { color: #e0901a; }

.bar { position: fixed; left: 270px; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); }
.bar .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.bar .grow { flex: 1; color: var(--sub); font-size: 14px; }
.bar .primary { padding: 10px 22px; font-size: 16px; }

.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border-radius: 14px; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 14px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.t-row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.t-row .name { flex: 1; min-width: 0; }
.t-row .name small { color: var(--sub); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; color: #fff; white-space: nowrap; font-weight: 600; }
.t-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--bg); border-radius: 10px; padding: 12px; margin-top: 12px; }
.t-form .full { grid-column: 1 / -1; }
.hint-s { font-size: 13px; color: var(--sub); }
.text-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.text-head label.field { margin: 0; }
.ai-btn { border-radius: 99px; padding: 4px 12px; font-size: 13px; border-color: var(--accent); color: var(--accent); }
.ai-vers { display: grid; gap: 10px; margin-top: 14px; }
.ai-ver { border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
.ai-ver .row { margin-top: 10px; justify-content: flex-end; white-space: normal; }
.ai-wait { text-align: center; padding: 24px 0; color: var(--sub); }
.fs-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fs-pick b { word-break: break-all; }
.fs-frames { display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 8px; margin-top: 14px; }
.fs-frame { flex: none; width: 210px; display: grid; gap: 6px; }
.fs-frame .story-frame { width: 100%; position: relative; }
.fs-frame .story-frame .del { position: absolute; top: 6px; right: 6px; border-radius: 99px; padding: 2px 9px; background: rgba(0,0,0,.6); color: #fff; border: 0; }
.fs-frame input, .fs-frame textarea { font-size: 13px; padding: 6px 8px; }
.fs-frame textarea { min-height: 64px; }
@media (max-width: 760px) { .fs-frame { width: 160px; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

.send .progress { height: 6px; background: var(--hint); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.send .progress div { height: 100%; background: var(--accent); transition: width .2s; }
.send .who { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.send .who b { font-size: 20px; }
.count { color: var(--sub); font-size: 13px; margin-left: auto; font-weight: 400; }
.send .hint { background: var(--hint); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 12px 0; }
.send .hint.warn { background: var(--warn-bg); color: var(--warn-ink); }
.steps { display: grid; gap: 8px; }
.step { display: flex; align-items: center; gap: 10px; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; flex: none; font-size: 14px; }
.step button { flex: 1; text-align: left; padding: 11px 14px; font-size: 15px; }
.step button.did, .chip.did { border-color: var(--ok); color: var(--ok); }
.send .nav { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
.send .nav .primary { flex: 1; padding: 11px; font-size: 16px; }
.preview { white-space: pre-wrap; font-size: 13px; color: var(--sub); max-height: 90px; overflow: auto; border-left: 3px solid var(--line); padding-left: 10px; margin-top: 8px; }
.done-list { margin: 8px 0 0; padding: 0; list-style: none; }
.done-list li { padding: 5px 0; display: flex; gap: 8px; align-items: center; }

.auto-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.auto-head { font-weight: 600; margin-bottom: 8px; }
.auto-head small { font-weight: 400; color: var(--sub); margin-left: 6px; font-size: 13px; }
.job-row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 14px; flex-wrap: wrap; }
.job-row .err { color: var(--danger); font-size: 13px; flex-basis: 100%; padding-left: 22px; }
.se-pages { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.se-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
.se-stage canvas { width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; display: block; touch-action: none; cursor: grab; background: #000; }
.se-side { min-width: 0; display: grid; gap: 4px; }
.se-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.se-tools button { border-radius: 99px; padding: 5px 12px; font-size: 14px; }
.se-emoji { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; margin-top: 8px; max-height: 150px; overflow: auto; }
.se-emoji button { font-size: 22px; padding: 4px; border: 0; background: transparent; }
.se-sec { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.se-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.se-row > span:first-child { font-size: 13px; color: var(--sub); width: 44px; flex: none; }
.se-row input[type=range] { flex: 1; min-width: 120px; width: auto; padding: 0; }
.se-row .chips { flex: 1; gap: 6px; }
.se-row .chip { padding: 3px 10px; font-size: 13px; }
.se-layer textarea { min-height: 0; margin-top: 8px; }
.se-colors { display: flex; gap: 6px; flex-wrap: wrap; }
.se-colors button { width: 28px; height: 28px; border-radius: 50%; padding: 0; border: 2px solid var(--line); }
.se-colors button.on { outline: 3px solid var(--accent); outline-offset: 1px; }
.se-note { margin-top: 10px; font-size: 13px; color: var(--sub); }
.se-note summary { cursor: pointer; color: var(--accent); }
.se-note p { margin: 6px 0 0; }
.link.danger { color: #e5484d; }
@media (max-width: 760px) { .se-wrap { grid-template-columns: 1fr; } .se-stage { width: min(220px, 62%); margin: 0 auto; } }
.story-frames { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.story-frame { flex: none; width: 200px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; background: #16181d; border: 1px solid var(--line); display: grid; place-items: center; }
.story-frame img, .story-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 760px) { .story-frame { width: 150px; } }
.ig-sum { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag-stage { position: relative; background: var(--hint); border-radius: 10px; overflow: hidden; max-height: 42vh; display: flex; justify-content: center; }
.tag-stage img { display: block; max-width: 100%; max-height: 42vh; cursor: crosshair; }
.tag-pin { position: absolute; transform: translate(-50%, 8px); background: rgba(0,0,0,.78); color: #fff; font-size: 13px; padding: 3px 4px 3px 9px; border-radius: 6px; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.tag-pin::before { content: ''; position: absolute; left: 50%; top: -6px; transform: translateX(-50%); border: 6px solid transparent; border-top: 0; border-bottom-color: rgba(0,0,0,.78); }
.tag-pin button { border: 0; background: none; color: #fff; padding: 0 3px; font-size: 12px; }
.tag-dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.3); pointer-events: none; }
.place-new summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 10px; }
.stepper { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; }
.stepper .st { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 4px; text-align: left; color: var(--sub); }
.stepper .st-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--hint); font-weight: 700; font-size: 13px; flex: none; }
.stepper .st-t { display: flex; flex-direction: column; font-size: 14px; line-height: 1.25; }
.stepper .st-t small { font-size: 12px; color: var(--sub); }
.stepper .st.done .st-n { background: var(--soft); color: var(--accent); }
.stepper .st.on { color: var(--ink); font-weight: 600; }
.stepper .st.on .st-n { background: var(--accent); color: #fff; }
.stepper .st-line { flex: 1; height: 2px; background: var(--line); min-width: 12px; }
.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode-card { text-align: left; padding: 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.mode-card:hover { border-color: var(--soft-line); }
.mode-card.on { border-color: var(--accent); background: var(--soft); }
.mode-title { font-size: 17px; font-weight: 700; }
.mode-lead { margin: 0; color: var(--ink); font-size: 14px; }
.mode-where { margin: 4px 0 0; font-size: 13px; color: var(--sub); }
.mode-card ul { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 4px; }
.mode-card li::before { margin-right: 6px; }
.mode-card li.ok::before { content: '✅'; }
.mode-card li.no::before { content: '❌'; }
.mode-card li.no { color: var(--sub); }
.mode-foot { margin: 6px 0 0; font-size: 12px; color: var(--sub); }
.mode-pick { margin-top: auto; padding-top: 8px; font-weight: 600; color: var(--accent); font-size: 14px; }
.step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.set-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
.set-row + .set-row { border-top: 1px dashed var(--line); }
.set-row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
@media (max-width: 760px) {
  .mode-cards { grid-template-columns: 1fr; }
  .stepper .st-t small { display: none; }
  .stepper .st-t { font-size: 13px; }
}
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: #111827; color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%); }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 34vh; }
  aside header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  aside h1 { margin: 0; font-size: 17px; flex: 1; }
  aside .new { width: auto; }
  aside footer { grid-template-columns: 1fr 1fr 1fr; padding: 8px 12px; }
  aside footer button { font-size: 13px; padding: 6px 4px; }
  .bar { left: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar .grow { display: none; }
  .bar .primary { flex: 1; padding: 10px; font-size: 15px; }
  .bar button { white-space: nowrap; }
  .bar .link { padding: 4px 2px; }
  .send .nav { flex-wrap: wrap; }
  .send .nav .primary { flex-basis: 100%; order: -1; }
  .send .nav #sSkip { margin-left: auto; }
  .editor { padding: 14px 16px 110px; }
  .t-form { grid-template-columns: 1fr; }
  .modal { padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1><button class="home-link" id="goHome" title="回主畫面">社群管家</button></h1>
      <button class="primary new" id="newPost">＋ 新增貼文</button>
    </header>
    <div class="posts" id="postList"></div>
    <footer>
      <button id="openTargets">管理發送對象</button>
      <button id="openBackup">備份／搬資料</button>
      <button id="openAuto">⚡ 自動發帳號</button>
      <div class="ver" id="appVer"></div>
    </footer>
  </aside>
  <main>
    <div class="editor" id="editor"></div>
  </main>
</div>
<div class="bar"><div class="inner">
  <span class="grow" id="barInfo"></span>
  <button class="link danger" id="delPost">刪除這則</button>
  <button id="lineBatch" hidden>LINE 分批</button>
  <button class="primary" id="autoSend" hidden>⚡ 自動發</button>
  <button class="primary" id="startSend">開始發送</button>
</div></div>

<div class="modal-bg" id="targetsModal"><div class="modal">
  <h3>發送對象 <button class="link" data-close>關閉</button></h3>
  <div id="targetList"></div>
  <div id="targetForm"></div>
</div></div>

<div class="modal-bg" id="igOptsModal"><div class="modal" style="width:min(720px,100%)">
  <h3>IG 貼文設定 <button class="link" id="igOptsClose">完成</button></h3>
  <div id="igOptsBody"></div>
</div></div>

<div class="modal-bg" id="storyModal"><div class="modal" style="width:min(920px,100%)">

<script>
// ===== 裝置判斷 =====
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
const canShareFiles = files => { try { return !!navigator.canShare && navigator.canShare({ files }); } catch { return false; } };

// ===== 各種發送對象 =====
// open(text, link, t)：要開的網址；mobileShare：手機上用系統「分享」把圖片影片丟過去
const enc = encodeURIComponent;
const TYPES = {

    label: 'LINE', color: '#06c755', kind: '訊息',
    open: (text, link) => IS_MOBILE || !link

    hint: n => IS_MOBILE
      ? `LINE 會打開分享畫面，勾選「${n}」（可以一次勾很多個），按傳送。有圖片影片就用「分享圖片影片」選 LINE。`
      : `會打開 LINE 的分享視窗（第一次要登入 LINE），勾選「${n}」後傳送。電腦版只能帶文字和連結，圖片請用手機或另外傳。`,
  },
  fbgroup: {

    hint: () => IS_MOBILE ? '點「留個言⋯」，長按貼上文字。圖片影片用「分享圖片影片」選 Facebook → 分享到社團。' : '點「留個言⋯」，按 Ctrl+V（Mac 是 ⌘V）貼上文字；圖片可以先「複製圖片」再貼上，或下載後拖進去。',
  },
  fb: {
    label: 'FB 動態', color: '#1877f2', kind: '貼文',
    open: (text, link) => link ? `https://www.facebook.com/sharer/sharer.php?u=${enc(link)}` : 'https://www.facebook.com/',
    hint: () => '文字已經複製好，在發文框貼上。有連結的話會自動帶出連結預覽。',
  },
  fbstory: {

// 社群 → 底下可以發的地方（新增對象時先選社群、再選發到哪裡）
const PLATFORMS = [
  { id: 'line', label: 'LINE', color: '#06c755', types: { line: '聊天室／群組' } },
  { id: 'fb', label: 'Facebook', color: '#1877f2', types: { fbgroup: '社團', fb: '個人動態', fbstory: '限時動態' } },
  { id: 'ig', label: 'Instagram', color: '#d6249f', types: { ig: '貼文', igstory: '限時動態' } },
  { id: 'threads', label: 'Threads', color: '#111827', types: { threads: '貼文' } },
  { id: 'x', label: 'X', color: '#0f1419', types: { x: '貼文' } },
  { id: 'other', label: '其他', color: '#64748b', types: { other: '自訂網址' } },
];
const platformOf = type => PLATFORMS.find(pl => type in pl.types);
const platformIndex = type => PLATFORMS.findIndex(pl => type in pl.types);
const byPlatform = list => [...list].sort((a, b) => platformIndex(a.type) - platformIndex(b.type));
// 自己帳號只有一個的類型，名稱可以自動帶入
const DEFAULT_NAME = { fb: '我的 FB', fbstory: '我的 FB 限動', ig: '我的 IG', igstory: '我的 IG 限動', threads: '我的 Threads', x: '我的 X' };
const NAME_HINT = { line: '例：客戶群、家人群（跟 LINE 裡的名稱一樣）', fbgroup: '例：台中室內設計交流', other: '例：公司官網留言板' };
const WEEK = '日一二三四五六';
const COOLDOWN_MS = 2 * 60 * 1000;

let S = { posts: [], targets: [], activeId: null, batchSize: 15 };
let saveTimer = null, editingTarget = null, bulkOpen = false, send = null, batch = null;
const blobs = {}, urls = {};   // 媒體檔：id → Blob / 預覽網址

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const active = () => S.posts.find(p => p.id === S.activeId);
const isVideo = m => /^video\//.test(m.type);

// ===== 儲存：瀏覽器的 IndexedDB（設定＋媒體檔）=====
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('multi-share', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('media'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode), req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = tx.onabort = () => rej(tx.error);
    });
  };
  return {
    get: (s, k) => run(s, 'readonly', o => o.get(k)),
    put: (s, k, v) => run(s, 'readwrite', o => o.put(v, k)),
    del: (s, k) => run(s, 'readwrite', o => o.delete(k)),
  };
})();
let dbOk = true;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (!dbOk) return;
    DB.put('kv', 'state', JSON.parse(JSON.stringify(S))).catch(() => toast('存檔失敗，瀏覽器可能不允許儲存'));
  }, 300);
}
async function mediaBlob(m) {
  if (!blobs[m.id] && dbOk) blobs[m.id] = await DB.get('media', m.id).catch(() => null);
  return blobs[m.id];
}
async function mediaUrl(m) {
  if (urls[m.id]) return urls[m.id];
  const b = await mediaBlob(m);
  return b ? (urls[m.id] = URL.createObjectURL(b)) : '';
}
function dropMedia(m) {
  if (urls[m.id]) URL.revokeObjectURL(urls[m.id]);
  delete urls[m.id]; delete blobs[m.id];
  if (dbOk) DB.del('media', m.id).catch(() => {});
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function fmtTime(iso) {
  if (!iso) return '立即';
  const d = new Date(iso), now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day0(d) - day0(now)) / 864e5);
  const dayLabel = diff === 0 ? '今天' : diff === 1 ? '明天' : diff === -1 ? '昨天' : `${d.getMonth() + 1}/${d.getDate()}（${WEEK[d.getDay()]}）`;
  return `${dayLabel} ${hm}`;
}
// 排程用的日期、時間按鈕（今天起 7 天＋常用時段；也可以選其他日期、自訂時間）
const QUICK_TIMES = ['08:00', '09:00', '10:00', '12:00', '15:00', '18:00', '20:00', '21:00'];
function schedulePicker(p) {
  const [date, hm] = p.time.split('T');
  const now = new Date(), today = localInput(now).slice(0, 10);
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    return { v: localInput(d).slice(0, 10), label: i === 0 ? '今天' : i === 1 ? '明天' : i === 2 ? '後天' : `${d.getMonth() + 1}/${d.getDate()}`, wk: WEEK[d.getDay()] };
  });
  const nowHm = localInput(now).slice(11);
  const isPast = new Date(p.time) <= now;
  const otherDay = !days.some(d => d.v === date);
  const otherTime = !QUICK_TIMES.includes(hm);
  return `
    <div class="pick-label">日期</div>
    <div class="chips">${days.map(d => `<button class="chip ${d.v === date ? 'on' : ''}" data-day="${d.v}">${d.label}<small>（${d.wk}）</small></button>`).join('')}
      <label class="chip ${otherDay ? 'on' : ''} pick-input">${otherDay ? esc(fmtTime(p.time).split(' ')[0]) : '其他日期'}<input type="date" id="pickDate" value="${date}" min="${today}"></label></div>
    <div class="pick-label">時間</div>
    <div class="chips">${QUICK_TIMES.map(t => `<button class="chip ${t === hm ? 'on' : ''} ${date === today && t <= nowHm ? 'past' : ''}" data-hm="${t}">${t}</button>`).join('')}
      <label class="chip ${otherTime ? 'on' : ''} pick-input">${otherTime ? hm : '自訂時間'}<input type="time" id="pickTime" value="${hm}"></label></div>
    <p class="${isPast ? 'warn-line' : 'when-line'}">${isPast ? '⚠️ 這個時間已經過了，請選之後的時間' : `📅 將在 <b>${esc(fmtTime(p.time))}</b> 發出`}</p>`;
}
function localInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function postTargets(p) { return p.mode === 'auto' ? [] : p.targets.map(id => S.targets.find(t => t.id === id)).filter(Boolean); }
function postStatus(p) {
  // 全自動還沒送到伺服器：不管有沒有選時間，都是「還沒送出」
  if (p.mode === 'auto' && !p.serverPost) return { cls: 'unsched', text: p.time ? '⚠️ 還沒送出' : '未排程' };
  const ts = postTargets(p), n = ts.filter(t => p.done?.[t.id]).length;
  if (ts.length && n === ts.length) return { cls: 'done', text: '已完成', finished: true };
  if (p.time && new Date(p.time) <= new Date()) return { cls: 'due', text: n ? `已發 ${n}/${ts.length}` : '時間到了' };
  return { cls: p.time || n ? '' : 'unsched', text: n ? `已發 ${n}/${ts.length}` : (p.time ? '⏰ 已排程' : '未排程') };
}
function fullText(p) { return [p.text.trim(), p.link.trim()].filter(Boolean).join('\n\n'); }
const hasContent = p => !!(fullText(p) || p.media.length);
// 已排程：全自動已送到伺服器，或半自動設了時間（時間到會提醒）
const isScheduled = p => !!p.serverPost || (p.mode !== 'auto' && !!p.time);

// ===== 左側列表 =====
function renderList() {
  const now = Date.now();
  const sorted = [...S.posts].sort((a, b) => (a.time ? new Date(a.time) : now) - (b.time ? new Date(b.time) : now));
  const groups = [['⏰ 已排程', p => !listStatus(p).finished && isScheduled(p)], ['⚠️ 未排程', p => !listStatus(p).finished && !isScheduled(p)], ['✅ 已完成', p => listStatus(p).finished]];
  $('#postList').innerHTML = groups.map(([title, f], gi) => {
    const items = sorted.filter(f);
    if (!items.length) return '';
    return `<div class="group-title ${gi === 1 ? 'warn' : ''}">${title}<span>${items.length}</span></div>` + (gi === 1 ? '<p class="group-hint">還沒排好、也還沒發出去</p>' : '') + items.map(p => {
      const st = listStatus(p);
      const snip = p.text.trim().split('\n')[0] || p.link || (p.media.length ? `（${p.media.length} 個檔案）` : '（還沒有內容）');
      return `<button class="post-item ${p.id === S.activeId ? 'active' : ''}" data-id="${p.id}">
        <div class="when"><span>${p.time || p.serverPost ? esc(fmtTime(p.time || (serverPosts[p.serverPost]?.run_at ? new Date(serverPosts[p.serverPost].run_at).toISOString() : null))) : (p.mode === 'auto' ? '⚡ 全自動' : p.mode === 'manual' ? '📱 半自動' : '還沒選發送方式')}</span><span class="pill ${st.cls}">${st.text}</span></div>
        <div class="snip">${esc(snip)}</div></button>`;
    }).join('');
  }).join('') || '<p class="empty" style="padding:0 8px">還沒有貼文</p>';
}
$('#postList').onclick = e => {
  const b = e.target.closest('.post-item'); if (!b) return;
  S.activeId = b.dataset.id; save(); renderAll();
};
$('#newPost').onclick = () => newPost();
$('#goHome').onclick = () => goHome();
function newPost() {
  const last = S.posts[S.posts.length - 1];
  const p = { id: uid(), text: '', link: '', media: [], time: null, targets: last ? [...last.targets] : [], auto: last ? [...(last.auto || [])] : [], mode: null, step: 1, serverPost: null, done: {}, reminded: false };
  S.posts.push(p); S.activeId = p.id; save(); renderAll();
  setTimeout(() => $('#text')?.focus(), 0);
}

// ===== 編輯區 =====
// 流程：① 內容（文字、圖片影片、限動畫面）→ ② 發送方式 p.mode = 'auto'（全自動）／'manual'（半自動）→ ③ 發到哪裡與時間；p.step = 1～3
const MODE_INFO = {
  auto: {
    icon: '⚡', title: '全自動發送', lead: '排好時間就不用管。時間到由伺服器自動發出，電腦、手機都可以關掉。',
    where: 'Instagram 貼文、Instagram 限動、Threads（要先連結帳號）',
    yes: ['IG 貼文最多 10 張，可標註人物、協作者 3 位、常用地點', 'IG 限動：用編好的限動畫面（文字、貼圖），發布前再確認一次', '一次發到多個帳號'],
    no: ['不能加音樂、限動貼圖（連結、投票…）', '不能發 LINE、Facebook（平台不開放）'],
  },
  manual: {
    icon: '📱', title: '半自動發送', lead: '網站幫你準備好文字和圖片，打開 App 貼上、按發送就好。',
    where: 'LINE、FB 社團／動態／限動、IG 貼文／限動、Threads、X、其他網址',
    yes: ['所有平台都能發，包括 LINE 群組和 FB 社團', 'IG 完整功能：音樂、20 張、協作者 5 位、搜尋地點、限動貼圖', 'IG 貼文可以用 IG App 的「排定時間」'],
    no: ['時間到要自己按（網頁或行事曆會提醒）', '每個地方各操作一次，大約 30 秒'],
  },
};
const STEP_NAMES = ['內容', '發送方式', '發到哪裡與時間'];
function stepSelCount(p) { return p.mode === 'auto' ? autoSelected(p).length : p.mode === 'manual' ? postTargets(p).length : 0; }
function goStep(p, n) {
  if (n >= 2 && !hasContent(p)) return toast('先輸入文字或加入圖片影片');
  if (n >= 3 && !p.mode) return toast('先選發送方式');
  p.step = n; save(); renderEditor();
  $('main').scrollTop = 0;
}
function contentSummary(p) {
  const parts = [];
  if (fullText(p)) parts.push('文字');
  const img = p.media.filter(m => !isVideo(m)).length, vid = p.media.length - img;
  if (img) parts.push(`${img} 張圖`);
  if (vid) parts.push(`${vid} 部影片`);
  return parts.join('＋');
}
function stepperHtml(p) {
  const done = [hasContent(p), !!p.mode, false];
  const sub = [contentSummary(p), p.mode ? MODE_INFO[p.mode].title : '', stepSelCount(p) ? `已選 ${stepSelCount(p)} 個` : ''];
  return `<div class="stepper">${STEP_NAMES.map((n, i) => `<button class="st ${p.step === i + 1 ? 'on' : ''} ${done[i] ? 'done' : ''}" data-step="${i + 1}">
    <span class="st-n">${done[i] && p.step !== i + 1 ? '✓' : i + 1}</span><span class="st-t">${n}${sub[i] ? `<small>${esc(sub[i])}</small>` : ''}</span></button>`).join('<span class="st-line"></span>')}</div>`;
}
function modeCardHtml(p, key) {
  const m = MODE_INFO[key], linked = autoAccounts.map(a => `@${esc(a.username)}（${a.platform === 'ig' ? 'IG' : 'Threads'}）`).join('、');
  return `<button class="mode-card ${p.mode === key ? 'on' : ''}" data-mode="${key}">
    <div class="mode-title">${m.icon} ${m.title}</div>
    <p class="mode-lead">${m.lead}</p>

    <ul>${m.yes.map(x => `<li class="ok">${x}</li>`).join('')}${m.no.map(x => `<li class="no">${x}</li>`).join('')}</ul>
    ${key === 'auto' ? `<p class="mode-foot">${linked ? '已連結：' + linked : '還沒連結帳號，下一步會帶你連結'}</p>` : ''}
    <span class="mode-pick">${p.mode === key ? '✓ 已選擇' : '選這個'}</span>
  </button>`;
}

function settingsHtml(p) {

    const opts = autoSelected(p), parts = [];

    if (opts.some(o => o.platform === 'ig' && o.kind === 'post')) parts.push(`<div class="set-row"><b>IG 貼文</b><span class="hint-s">${esc(igSummary(p))}</span><button class="link" id="igOptsOpen" style="color:var(--accent)">標註人物／協作者／地點 ⚙</button></div>`);
    if (opts.some(o => o.platform === 'ig' && o.kind === 'story')) parts.push(`<div class="set-row"><b>IG 限動</b><span class="hint-s">按發送時會先打開限動編輯，確認畫面後才發</span><button class="link" data-seopen style="color:var(--accent)">🎨 編輯限動畫面</button></div>`);
    if (opts.some(o => o.platform === 'threads')) { const n = [...fullText(p)].length; parts.push(`<div class="set-row"><b>Threads</b><span class="${n > 500 ? 'warn-line' : 'hint-s'}" style="margin:0">文字 ${n}／500 字</span></div>`); }

  const types = [...new Set(postTargets(p).map(t => t.type))];
  return phoneNote(postTargets(p)) + types.map(t => `<div class="set-row"><span class="dot" style="background:${TYPES[t].color}"></span><span class="hint-s" style="color:var(--ink)">${MANUAL_TIP[t]}</span>${/story$/.test(t) && p.media.length ? `<button class="link" data-seopen style="color:var(--accent)">🎨 編輯限動畫面${p.storyEdit?.done ? ' ✓' : ''}</button>` : ''}</div>`).join('');

// 主畫面：沒有選貼文時，列出已排程、未排程

    <span class="snip">${esc(p.text.trim().split('\n')[0] || p.link || (p.media.length ? `（${p.media.length} 個檔案）` : '（還沒有內容）'))}</span>
    <span class="hint-s">${isScheduled(p) || p.serverPost ? esc(fmtTime(p.time || (serverPosts[p.serverPost]?.run_at ? new Date(serverPosts[p.serverPost].run_at).toISOString() : null))) : ''}</span></button>`;
  const lr = S.lastResult && Date.now() - S.lastResult.at < 30 * 60e3 ? S.lastResult : null;

  if (lrDone) { lr.title = '✅ 已發布'; lr.text = lr.text.replace(/^.*?(會自動發到|會發到)：/, '已經發到：'); }

    ${lr ? `<div class="card home-ok"><h2>${esc(lr.title)} <button class="link" id="homeOkClose">知道了</button></h2>
      <p style="margin:0">${esc(lr.text)}</p><p class="hint-s" style="margin:6px 0 0">已經送到伺服器了，網頁和電腦都可以關掉。發送結果會顯示在左邊「⏰ 已排程」那則貼文上。</p></div>` : ''}

function goHome(msg) {

  $('main').scrollTop = 0;
  if (msg) toast(msg);
}
// 「發文設定」卡片只重畫自己（打字時不要整頁重畫，游標才不會跑掉）
function renderEditorSettings(p) {
  if (active() !== p) return;
  const card = $('#setCard');
  if (card) card.innerHTML = setCardHtml(p);
  const sc = $('#storyCard');
  if (sc) sc.innerHTML = storyCardHtml(p);

function bindSettings(p) {
  if ($('#igOptsOpen')) $('#igOptsOpen').onclick = () => openIgOpts(p);
  document.querySelectorAll('#editor [data-seopen]').forEach(x => x.onclick = () => openStoryEditor(p));

async function renderThumbs() {
  const p = active(), box = $('#thumbs'); if (!box) return;
  box.innerHTML = p.media.map((m, i) => `<div class="thumb" data-i="${i}">
    <span class="tag">${isVideo(m) ? '影片' : /gif/.test(m.type) ? 'GIF' : ''}</span>
    <button class="x" data-i="${i}" title="移除">✕</button></div>`).join('');
  box.querySelectorAll('.tag').forEach(t => { if (!t.textContent) t.remove(); });
  box.querySelectorAll('.x').forEach(b => b.onclick = () => {
    const m = p.media[+b.dataset.i];
    p.media = p.media.filter(x => x !== m); dropMedia(m); save(); renderThumbs(); renderBar(); renderList(); renderEditorSettings(p); refreshStepper(p);
  });
  for (const [i, m] of p.media.entries()) {
    const src = await mediaUrl(m), cell = box.querySelector(`.thumb[data-i="${i}"]`);
    if (!cell || !src) continue;
    const el = document.createElement(isVideo(m) ? 'video' : 'img');
    el.src = isVideo(m) ? src + '#t=0.5' : src;
    if (isVideo(m)) { el.muted = true; el.preload = 'metadata'; el.playsInline = true; }
    cell.prepend(el);
  }
}
async function addFiles(p, files) {
  for (const f of files) {
    if (!/^(image|video)\//.test(f.type)) { toast(`「${f.name}」不是圖片或影片`); continue; }
    const m = { id: uid(), name: f.name, type: f.type };
    blobs[m.id] = f;
    if (dbOk) {
      try { await DB.put('media', m.id, f); }
      catch { toast('檔案太大，瀏覽器存不下；重新整理後會不見'); }
    }
    p.media.push(m);
  }
  save(); renderThumbs(); renderBar(); renderList();
  if (active() === p) { renderEditorSettings(p); refreshStepper(p); }
}

function renderBar() {

  const icsText = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);

    `SUMMARY:${icsText('發文提醒：' + title)}`,

// 每行：「名稱」或「名稱 網址」或只有網址；FB 社團網址統一成 https://www.facebook.com/groups/<id>/
function parseBulkLine(line, defType) {
  line = line.trim();
  if (!line) return null;
  const m = line.match(/https?:\/\/\S+/i);
  if (!m) return { name: line.slice(0, 80), type: defType, url: '' };
  let url = m[0], name = line.replace(m[0], '').replace(/\s+/g, ' ').trim();
  const g = url.match(/facebook\.com\/groups\/([^/?#\s]+)/i);
  if (g) url = `https://www.facebook.com/groups/${g[1]}/`;
  return { name: (name || url).slice(0, 80), type: g ? 'fbgroup' : 'other', url };
}
function addBulk(text, defType, cat) {
  let added = 0, skipped = 0;
  for (const line of text.split(/\r?\n/)) {
    const t = parseBulkLine(line, defType);
    if (!t) continue;
    const dup = S.targets.some(x => t.url ? x.url === t.url : x.type === t.type && x.name === t.name);
    if (dup) { skipped++; continue; }
    S.targets.push({ id: uid(), cat, ...t });
    added++;
  }
  return { added, skipped };
}
// 書籤程式：在 FB「你的社團」頁面自動捲到底，抓出社團名稱和網址，顯示在畫面上讓你複製
function fbImporter() {
  const SKIP = /^(joins|feed|discover|create|notifications|search|your_groups|category|invites|requests|learning_content)$/i;
  const collect = () => {
    const m = new Map();
    document.querySelectorAll('a[href*="/groups/"]').forEach(a => {
      let u; try { u = new URL(a.href, location.href); } catch { return; }
      const seg = u.pathname.split('/').filter(Boolean), i = seg.indexOf('groups'), id = seg[i + 1];
      if (i < 0 || !id || SKIP.test(id) || seg.length > i + 2) return;
      const key = `https://www.facebook.com/groups/${id}/`;
      const name = (a.innerText || a.getAttribute('aria-label') || '').trim().split('\n')[0].trim();
      if (!name || name.length > 100 || /^(查看社團|檢視社團|View group|前往社團|Visit group)$/i.test(name)) return;
      if (!m.has(key)) m.set(key, name);
    });
    return m;
  };
  if (!/(^|\.)facebook\.com$/.test(location.hostname)) { alert('請在 Facebook 網站上按這個書籤'); return; }
  if (!/^\/groups\/joins/.test(location.pathname)) {
    if (confirm('要先打開「你的社團」頁面嗎？\n打開後請再按一次這個書籤。')) location.href = 'https://www.facebook.com/groups/joins/';
    return;
  }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;z-index:2147483647;top:20px;right:20px;width:360px;background:#fff;color:#111;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:16px;font:14px/1.5 system-ui,sans-serif';
  box.textContent = '正在往下捲動，載入你所有的社團⋯';
  document.body.appendChild(box);
  (async () => {
    let last = 0, same = 0;
    for (let k = 0; k < 80 && same < 3; k++) {
      window.scrollTo(0, document.documentElement.scrollHeight);
      await new Promise(r => setTimeout(r, 1300));
      const h = document.documentElement.scrollHeight;
      same = h === last ? same + 1 : 0; last = h;
      box.textContent = `正在往下捲動⋯已找到 ${collect().size} 個社團`;
    }
    const found = collect();
    const text = [...found].map(([url, name]) => `${name}\t${url}`).join('\n');
    box.innerHTML = '';
    const h = document.createElement('b'); h.textContent = `找到 ${found.size} 個社團`;
    const ta = document.createElement('textarea'); ta.value = text; ta.readOnly = true;
    ta.style.cssText = 'width:100%;height:180px;margin:8px 0;font-size:12px;border:1px solid #ccc;border-radius:6px;padding:6px;box-sizing:border-box';
    const btn = document.createElement('button'); btn.textContent = '複製';
    btn.style.cssText = 'background:#1877f2;color:#fff;border:0;border-radius:6px;padding:8px 18px;font-weight:600;cursor:pointer;margin-right:8px';
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(text); } catch { ta.select(); document.execCommand('copy'); }
      btn.textContent = '已複製 ✓，回社群管家貼上';
    };
    const close = document.createElement('button'); close.textContent = '關閉';
    close.style.cssText = 'background:#eee;border:0;border-radius:6px;padding:8px 14px;cursor:pointer';
    close.onclick = () => box.remove();
    box.append(h, ta, btn, close);
  })();
}

// ===== 媒體：複製、下載、手機分享 =====
async function mediaFiles(p, story) {
  if (story) { const f = await storyFiles(p).catch(() => null); if (f) return f; }
  const out = [];
  for (const m of p.media) { const b = await mediaBlob(m); if (b) out.push(new File([b], m.name, { type: m.type })); }
  return out;
}
// 剪貼簿只收 PNG；把轉檔的 Promise 直接交給 ClipboardItem，Mac 的 Safari 才不會擋
async function copyImage(m) {
  const png = (async () => {
    const bmp = await createImageBitmap(await mediaBlob(m));
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    return new Promise(r => c.toBlob(r, 'image/png'));
  })();
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
}
async function downloadAll(p, story) {
  for (const f of await mediaFiles(p, story)) {
    saveFile(f, f.name);
    await new Promise(r => setTimeout(r, 400));
  }
}
// iPhone 的 Safari 規定「分享」要在按下的當下呼叫，中間不能先等讀檔，所以檔案要事先準備好
const shareCache = {};
function prepareShare(p, story) {
  story = !!(story && p.storyEdit?.done);
  const key = p.id + ':' + p.media.map(m => m.id).join(',') + (story ? ':story' + p.storyEdit.ver : '');
  if (!shareCache[key]) { shareCache[key] = { files: null }; mediaFiles(p, story).then(f => shareCache[key].files = f); }
  return shareCache[key];
}
async function shareMedia(p, withText = true, story = false) {
  const files = prepareShare(p, story).files, text = fullText(p);
  if (!files) { toast('檔案準備中，請再按一次'); return; }
  const data = files.length ? { files } : {};
  if (withText && text) data.text = text;
  const copy = text ? navigator.clipboard.writeText(text).catch(() => {}) : null;
  await navigator.share(data);
  await copy;
}

      storyMedia.push(isVideo(m) ? await uploadMedia(b, videoType({ ...m, type: b.type || m.type }, b)) : await uploadMedia(b, 'image/jpeg'));
    }
    btn.textContent = '送出中⋯'; onMsg?.('送出中⋯');
    const targets = opts.map(o => isStory(o) && storyMedia.length ? { account: o.account, kind: o.kind, media: storyMedia }
      : o.platform === 'ig' && o.kind === 'post' ? { account: o.account, kind: o.kind, ig: igPayload(p) } : { account: o.account, kind: o.kind });
    const r = await apiCall('/api/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, media, targets, run_at: p.time && !late ? new Date(p.time).getTime() : Date.now() }) });
    p.serverPost = r.id; save();
    logRemote('trace', '送出成功 ' + r.id);
    serverPosts[r.id] = { status: 'scheduled', run_at: r.run_at, targets: opts.map(o => ({ account: o.account, kind: o.kind })), jobs: [] };
    setTimeout(refreshServerPosts, 8000);
    const where = opts.map(o => `${o.label} @${o.username}`).join('、');
    S.lastResult = { at: Date.now(), postId: p.id, title: when === '現在' ? '✅ 已送出' : '✅ 排程成功',
      text: when === '現在' ? `大約 1～2 分鐘內會發到：${where}` : `${fmtTime(p.time)} 會自動發到：${where}` };
    goHome(when === '現在' ? '已送出，大約 1～2 分鐘內發出' : `排程成功：${fmtTime(p.time)} 自動發出`);
    return true;
  } catch (e) {
    logRemote('sendAuto', e.message);
    renderAll();
    alert('⚠️ 自動發沒有送出\n\n原因：' + e.message + '\n\n請照上面的說明處理後，再按一次「排程自動發」。');
    return false;
  }
}

// ===== 限動編輯器：文字（大小、字體、顏色）、貼圖、地點／時間／提及樣式，照片影片可以移動縮放 =====
// IG 的 API 不能在限動上加字或貼圖，所以全部畫進圖片（影片則錄成新的 MP4）。
// p.storyEdit = { ver, frames: { [檔案 id]: { zoom, ox, oy, fill, filter, layers: [...] } }, out: { [檔案 id]: 已輸出的 ver } }
// layer = { id, kind: 'text'|'emoji'|'tag', text, x, y（中心點，1080×1920 座標）, size, font, color, bg, icon }
const SW = 1080, SH = 1920;
const SE_FONTS = [
  ['sans', '黑體', '"Noto Sans TC"', 700],
  ['serif', '明體', '"Noto Serif TC"', 700],
  ['round', '圓體', '"Huninn"', 400],
  ['kai', '楷書', '"LXGW WenKai TC"', 700],
  ['hand', '手寫', '"Iansui"', 400],

const SE_FALLBACK = '"Microsoft JhengHei", "PingFang TC", "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
const SE_COLORS = ['#ffffff', '#111111', '#f5c46b', '#ff6b6b', '#ff8fb1', '#7bd389', '#5ab0ff', '#b48cff'];
const SE_BGS = [['none', '無'], ['dark', '黑底'], ['light', '白底'], ['solid', '同色底']];
const SE_FILTERS = [['none', '原圖', ''], ['vivid', '鮮豔', 'saturate(1.35) contrast(1.06)'], ['warm', '暖色', 'sepia(.22) saturate(1.15) brightness(1.03)'],
  ['cool', '冷色', 'saturate(.9) hue-rotate(-12deg) brightness(1.04)'], ['bright', '明亮', 'brightness(1.13) contrast(1.04)'], ['bw', '黑白', 'grayscale(1) contrast(1.1)']];
const SE_FILLS = [['blur', '模糊'], ['black', '黑'], ['white', '白']];
const SE_EMOJI = '😀😍🥰😎🤩😂👍👏🙌💪🙏✨🔥💖❤️🧡💛💚💙💜⭐🌟🎉🎁🛍️🏷️📣💯✅⚡🌸🌿🍂☀️🌙☕🍰🏠🛋️🪑🎄'.match(/\p{Extended_Pictographic}️?/gu);
const seFont = id => SE_FONTS.find(f => f[0] === id) || SE_FONTS[0];
const seUid = () => Math.random().toString(36).slice(2, 9);
let seFontsLinked = false;
function seLinkFonts() {
  if (seFontsLinked) return;
  seFontsLinked = true;
  const l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&family=Huninn&family=LXGW+WenKai+TC:wght@700&family=Iansui&display=swap';
  document.head.appendChild(l);
  document.fonts?.addEventListener?.('loadingdone', () => seDraw());
}
// 中文字體是分片下載的，畫之前要先把用到的字載好
async function seLoadFonts(layers) {
  if (!document.fonts?.load) return;
  await Promise.all(layers.filter(l => l.kind !== 'emoji').map(l => {
    const f = seFont(l.font);
    return document.fonts.load(`${f[3]} 64px ${f[2]}`, l.text || 'a').catch(() => {});
  }));
}
function storyEdit(p) {
  p.storyEdit ||= { ver: 1, frames: {}, out: {} };
  const se = p.storyEdit;
  p.media.forEach((m, i) => {
    if (se.frames[m.id]) return;
    const fr = { zoom: 1, ox: 0, oy: 0, fill: 'blur', filter: 'none', layers: [] };
    // 舊版的限動設定（文字＋上中下位置）轉成文字圖層；新的只在第一張放貼文文字
    const old = p.story, text = old ? (old.pos === 'none' ? '' : old.text) : i === 0 ? p.text.trim() : '';
    if (text && text.trim()) {
      const y = { top: 420, middle: SH / 2, bottom: SH - 520 }[old?.pos || 'bottom'] || SH - 520;
      fr.layers.push({ id: seUid(), kind: 'text', text: text.trim(), x: SW / 2, y, size: [...text].length > 60 ? 46 : 60, font: 'sans',
        color: old?.style === 'light' ? '#111111' : '#ffffff', bg: old?.style === 'light' ? 'light' : old?.style === 'plain' ? 'none' : 'dark' });
    }
    se.frames[m.id] = fr;
  });
  return se;
}
function seBump(p) { p.storyEdit.ver++; save(); }

// ---- 畫圖 ----
function seRoundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const seContrast = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150 ? '#111111' : '#ffffff'; };
// 算出圖層要畫的行和外框（中心點 x,y）
function seLayout(g, l) {
  if (l.kind === 'emoji') {
    g.font = `${l.size}px ${SE_FALLBACK}`;
    const w = g.measureText(l.text).width;
    return { lines: [l.text], lh: l.size * 1.15, font: g.font, w, h: l.size * 1.15, pad: 0 };
  }
  const f = l.kind === 'tag' ? SE_FONTS[0] : seFont(l.font);
  const label = l.kind === 'tag' ? `${l.icon} ${l.text}` : l.text;
  g.font = `${f[3]} ${l.size}px ${f[2]}, ${SE_FALLBACK}`;
  const lines = wrapLines(g, label, SW - 140).slice(0, 14);
  const lh = l.size * 1.32;
  const w = Math.max(1, ...lines.map(s => g.measureText(s).width));
  const pad = l.kind === 'tag' ? l.size * 0.55 : (l.bg === 'none' ? 0 : l.size * 0.5);
  return { lines, lh, font: g.font, w: w + pad * 2, h: lines.length * lh + pad * 2 - (lh - l.size) + (l.kind === 'tag' ? 0 : 0), pad };
}
function seDrawLayer(g, l) {
  const L = seLayout(g, l), x0 = l.x - L.w / 2, y0 = l.y - L.h / 2;
  g.save();
  g.textAlign = 'center'; g.textBaseline = 'top'; g.font = L.font;
  let fg = l.color || '#ffffff';
  if (l.kind === 'tag') {
    g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 18; g.shadowOffsetY = 4;
    g.fillStyle = '#ffffff'; seRoundRect(g, x0, y0, L.w, L.h, Math.min(L.h / 2, 28)); g.fill();
    g.shadowColor = 'transparent';
    const gr = g.createLinearGradient(x0, 0, x0 + L.w, 0);
    gr.addColorStop(0, '#8a3ab9'); gr.addColorStop(.5, '#e1306c'); gr.addColorStop(1, '#f77737');
    fg = gr;
  } else if (l.kind === 'text' && l.bg !== 'none') {
    const bg = l.bg === 'dark' ? 'rgba(0,0,0,.62)' : l.bg === 'light' ? 'rgba(255,255,255,.94)' : l.color;
    if (l.bg === 'light') fg = l.color === '#ffffff' ? '#111111' : l.color;
    if (l.bg === 'solid') fg = seContrast(l.color);
    g.fillStyle = bg; seRoundRect(g, x0, y0, L.w, L.h, Math.min(28, l.size * 0.45)); g.fill();
  } else if (l.kind === 'text') {
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = l.size * 0.25;
  }
  g.fillStyle = fg;
  L.lines.forEach((s, i) => g.fillText(s, l.x, y0 + L.pad + i * L.lh));
  g.restore();
  return { x0, y0, x1: x0 + L.w, y1: y0 + L.h };
}
// src：ImageBitmap 或 <video>；w/h 是原始大小
function seDrawFrame(g, fr, src, w, h, sel) {
  g.save();
  g.fillStyle = fr.fill === 'white' ? '#ffffff' : '#000000'; g.fillRect(0, 0, SW, SH);
  const filt = SE_FILTERS.find(f => f[0] === fr.filter)?.[2] || '';
  const canFilter = 'filter' in g;
  if (src && w && h) {
    if (fr.fill === 'blur' && canFilter) {
      const cover = Math.max(SW / w, SH / h);
      g.filter = `blur(40px) brightness(.55) ${filt}`;
      g.drawImage(src, (SW - w * cover) / 2, (SH - h * cover) / 2, w * cover, h * cover);
    }
    if (canFilter) g.filter = filt || 'none';
    const s = Math.min(SW / w, SH / h) * fr.zoom;
    g.drawImage(src, SW / 2 + fr.ox - w * s / 2, SH / 2 + fr.oy - h * s / 2, w * s, h * s);
    if (canFilter) g.filter = 'none';
  }
  g.restore();
  const boxes = {};
  for (const l of fr.layers) boxes[l.id] = seDrawLayer(g, l);
  if (sel && boxes[sel]) {
    const b = boxes[sel];
    g.save(); g.strokeStyle = '#ffffff'; g.lineWidth = 4; g.setLineDash([16, 12]);
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 6;
    g.strokeRect(b.x0 - 14, b.y0 - 14, b.x1 - b.x0 + 28, b.y1 - b.y0 + 28);
    g.restore();
  }
  return boxes;
}

// ---- 編輯器視窗 ----
let seCtx = null;   // { p, opts（全自動要發的目標，沒有就是只編輯）, i（第幾個檔案）, sel, src, video, boxes, raf }
function openStoryEditor(p, opts = null) {
  logRemote('trace', '打開限動編輯 ' + (opts ? '（送出前）' : '（只編輯）'));
  if (!p.media.length) return toast('限動要先加入圖片或影片');
  seLinkFonts();
  storyEdit(p);
  seCtx = { p, opts, i: 0, sel: null, boxes: {} };
  $('#storyModal').classList.add('open');
  renderStoryEditor();
  seLoadSource();
}
function seFrame() { const { p, i } = seCtx; return p.storyEdit.frames[p.media[i].id]; }
function seLayer() { return seFrame().layers.find(l => l.id === seCtx.sel); }
async function seLoadSource() {
  const ctx = seCtx, m = ctx.p.media[ctx.i];
  seStopVideo(ctx);
  ctx.src = null;
  const blob = await mediaBlob(m);
  if (seCtx !== ctx || ctx.p.media[ctx.i] !== m) return;
  if (!blob) return toast(`找不到「${m.name}」，請重新加入`);
  if (isVideo(m)) {
    const v = document.createElement('video');
    v.src = ctx.videoUrl = URL.createObjectURL(blob); v.muted = true; v.loop = true; v.playsInline = true;
    await new Promise(r => { v.onloadeddata = r; v.onerror = r; setTimeout(r, 8000); });
    v.play().catch(() => {});
    ctx.video = v; ctx.src = { el: v, w: v.videoWidth, h: v.videoHeight };
    const loop = () => { if (seCtx !== ctx || ctx.video !== v) return; seDraw(); ctx.raf = requestAnimationFrame(loop); };
    loop();
  } else {
    const bmp = await createImageBitmap(blob);
    ctx.src = { el: bmp, w: bmp.width, h: bmp.height };
  }
  await seLoadFonts(seFrame().layers);
  seDraw();
}
function seStopVideo(ctx) {
  if (ctx.raf) cancelAnimationFrame(ctx.raf);
  if (ctx.video) { ctx.video.pause(); ctx.video = null; }
  if (ctx.videoUrl) { URL.revokeObjectURL(ctx.videoUrl); ctx.videoUrl = null; }
}
function seDraw() {
  const ctx = seCtx, c = $('#seCanvas');

  ctx.boxes = seDrawFrame(g, seFrame(), s?.el, s?.w, s?.h, ctx.sel);
}
function closeStoryEditor(why) {

}

function seAdd(kind) {

  if (kind === 'loc') {

  }
  if (kind === 'time') {
    const d = p.time ? new Date(p.time) : new Date();
    return seAddLayer({ kind: 'tag', icon: '🕒', text: `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`, size: 54 });
  }

}

  box.innerHTML = `<div class="se-sec se-layer"><div class="se-row" style="justify-content:space-between"><b>${name}</b><span><button class="link" id="seUp">移到最上層</button><button class="link danger" id="seDel">刪除</button></span></div>

      <div class="se-row"><span>顏色</span><div class="se-colors">${SE_COLORS.map(c => `<button class="${l.color === c ? 'on' : ''}" data-secolor="${c}" style="background:${c}" title="${c}"></button>`).join('')}</div></div>
      <div class="se-row"><span>底色</span><div class="chips">${SE_BGS.map(([v, lab]) => `<button class="chip ${l.bg === v ? 'on' : ''}" data-sebg="${v}">${lab}</button>`).join('')}</div></div>` : ''}
  </div>`;

  $('#seUp').onclick = () => { const fr = seFrame(); fr.layers = [...fr.layers.filter(x => x !== l), l]; seBump(p); seDraw(); };
  box.querySelectorAll('[data-sefont]').forEach(b => b.onclick = async () => { l.font = b.dataset.sefont; seBump(p); renderSeLayer(); seDraw(); await seLoadFonts([l]); seDraw(); });
  box.querySelectorAll('[data-secolor]').forEach(b => b.onclick = () => { l.color = b.dataset.secolor; seBump(p); renderSeLayer(); seDraw(); });
  box.querySelectorAll('[data-sebg]').forEach(b => b.onclick = () => { l.bg = b.dataset.sebg; seBump(p); renderSeLayer(); seDraw(); });
}
// 拖曳：點到圖層就移動圖層，點到空白就移動照片；兩指縮放、滾輪縮放
function seBindStage() {
  const c = $('#seCanvas'), pts = new Map();
  let drag = null, pinch = null;
  const pos = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * SW / r.width, y: (e.clientY - r.top) * SH / r.height }; };
  const hit = q => {
    const ls = seFrame().layers;
    for (let k = ls.length - 1; k >= 0; k--) { const b = seCtx.boxes[ls[k].id]; if (b && q.x >= b.x0 - 20 && q.x <= b.x1 + 20 && q.y >= b.y0 - 20 && q.y <= b.y1 + 20) return ls[k]; }
    return null;
  };
  c.onpointerdown = e => {
    c.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, pos(e));
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], l = seLayer(), fr = seFrame();
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), base: l ? l.size : fr.zoom, l };
      drag = null; return;
    }
    const q = pos(e), l = hit(q), fr = seFrame();
    if ((seCtx.sel || null) !== (l?.id || null)) { seCtx.sel = l?.id || null; renderSeLayer(); }
    drag = l ? { l, dx: l.x - q.x, dy: l.y - q.y } : { bg: true, sx: q.x, sy: q.y, ox: fr.ox, oy: fr.oy };
    seDraw();
  };
  c.onpointermove = e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, pos(e));
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()], k = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
      if (pinch.l) pinch.l.size = Math.max(24, Math.min(600, Math.round(pinch.base * k)));
      else seFrame().zoom = Math.max(.3, Math.min(3, pinch.base * k));
      seDraw(); return;
    }
    if (!drag) return;
    const q = pos(e), fr = seFrame();
    if (drag.l) { drag.l.x = Math.round(q.x + drag.dx); drag.l.y = Math.round(q.y + drag.dy); }
    else { fr.ox = Math.round(drag.ox + q.x - drag.sx); fr.oy = Math.round(drag.oy + q.y - drag.sy); }
    seDraw();
  };
  c.onpointerup = c.onpointercancel = e => {
    pts.delete(e.pointerId);
    if (drag || pinch) { seBump(seCtx.p); if (pinch) { renderSeLayer(); const z = $('#seZoom'); if (z) z.value = Math.round(seFrame().zoom * 100); } }
    if (!pts.size) { drag = null; pinch = null; }
  };
  c.onwheel = e => {
    e.preventDefault();
    const l = seLayer(), fr = seFrame(), k = e.deltaY < 0 ? 1.06 : 1 / 1.06;
    if (l) { l.size = Math.max(24, Math.min(600, Math.round(l.size * k))); const s = $('#seSize'); if (s) s.value = l.size; }
    else { fr.zoom = Math.max(.3, Math.min(3, fr.zoom * k)); const z = $('#seZoom'); if (z) z.value = Math.round(fr.zoom * 100); }
    seBump(seCtx.p); seDraw();
  };
  c.ondblclick = () => $('#seText')?.focus();
}

// ---- 輸出：圖片畫成 JPEG；影片一邊播放一邊錄成 MP4（瀏覽器不支援就用原檔）----
async function seExportImage(fr, blob) {
  const bmp = await createImageBitmap(blob);
  await seLoadFonts(fr.layers);
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  seDrawFrame(c.getContext('2d'), fr, bmp, bmp.width, bmp.height, null);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}
// 影片：一邊播放一邊把每一格畫上文字貼圖，重新壓成 1080×1920 的 MP4（H.264＋AAC，IG 收這種）。
// 優先用 WebCodecs（軟體編碼比較穩，有些電腦的硬體編碼會卡住）；不支援就改用 MediaRecorder；都不行就用原檔。
let muxerLib = null;
function loadMuxer() {
  return muxerLib ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js';
    s.onload = () => res(window.Mp4Muxer);
    s.onerror = () => { muxerLib = null; s.remove(); rej(new Error('影片工具下載失敗，請檢查網路')); };
    document.head.appendChild(s);
  });
}
async function seVideoConfig() {
  if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') return null;
  for (const hw of ['prefer-software', 'no-preference']) for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42002a']) {
    const cfg = { codec, width: SW, height: SH, bitrate: 6e6, framerate: 30, hardwareAcceleration: hw, avc: { format: 'avc' } };
    if ((await VideoEncoder.isConfigSupported(cfg).catch(() => null))?.supported) return cfg;
  }
  return null;
}
// 把影片的聲音解成 48kHz 的聲波（沒有聲音就回傳 null）
async function seDecodeAudio(blob) {
  try {
    const ac = new OfflineAudioContext(2, 48000, 48000);
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    return buf.length ? buf : null;
  } catch { return null; }
}
const SE_LIMIT = 60;   // IG 限動影片最長 60 秒
async function seEncodeVideo(fr, blob, onTick) {
  const vcfg = await seVideoConfig();
  if (!vcfg) return null;
  const audio = await seDecodeAudio(blob), ch = audio ? Math.min(2, audio.numberOfChannels) : 0;
  const acfg = audio && typeof AudioEncoder !== 'undefined' ? { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: ch, bitrate: 128000 } : null;
  if (audio && !(acfg && (await AudioEncoder.isConfigSupported(acfg).catch(() => null))?.supported)) return null;   // 有聲音卻不能壓 AAC：改用別的方法
  const M = await loadMuxer();
  await seLoadFonts(fr.layers);
  const url = URL.createObjectURL(blob), v = document.createElement('video');
  v.src = url; v.muted = true; v.playsInline = true;
  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('影片讀不出來')); setTimeout(() => rej(new Error('影片讀不出來（逾時）')), 15000); });
    const limit = Math.min(isFinite(v.duration) && v.duration > 0 ? v.duration : SE_LIMIT, SE_LIMIT);
    // 上傳上限 25MB：影片越長，畫質壓低一點
    vcfg.bitrate = Math.max(1.2e6, Math.min(6e6, Math.floor(25 * 1024 * 1024 * 8 * 0.85 / limit) - 128000));
    const target = new M.ArrayBufferTarget();
    const muxer = new M.Muxer({ target, fastStart: 'in-memory', firstTimestampBehavior: 'offset',
      video: { codec: 'avc', width: SW, height: SH }, ...(acfg ? { audio: { codec: 'aac', numberOfChannels: ch, sampleRate: 48000 } } : {}) });
    let err = null;
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => err = e });
    venc.configure(vcfg);
    const c = document.createElement('canvas'); c.width = SW; c.height = SH;
    const g = c.getContext('2d');
    let last = -1, n = 0;
    await new Promise((res, rej) => {
      let finished = false, moved = Date.now();
      const end = () => { if (!finished) { finished = true; clearInterval(watch); res(); } };
      // 有些影片格式（例如 iPhone 的 HEVC）瀏覽器解不開，畫面不會動：10 秒沒進度就放棄
      const watch = setInterval(() => {
        if (finished) return clearInterval(watch);
        if (Date.now() - moved > 10000) { finished = true; clearInterval(watch); v.pause(); rej(new Error('影片解不開（可能是 HEVC 格式）')); }
      }, 1000);
      const onFrame = async (now, meta) => {
        if (finished) return;
        if (err) { finished = true; clearInterval(watch); return rej(err); }
        const t = meta?.mediaTime ?? v.currentTime;
        if (t > last && t < limit) {
          last = t; moved = Date.now();
          seDrawFrame(g, fr, v, v.videoWidth, v.videoHeight, null);
          const f = new VideoFrame(c, { timestamp: Math.round(t * 1e6) });
          venc.encode(f, { keyFrame: n++ % 60 === 0 }); f.close();
          onTick?.(t, limit);
          // 電腦壓不夠快時先暫停播放，等它跟上，才不會漏掉畫面
          if (venc.encodeQueueSize > 12) {
            v.pause();
            while (venc.encodeQueueSize > 3 && !err) await new Promise(r => setTimeout(r, 15));
            await v.play().catch(() => {});
          }
        }
        if (t >= limit || v.ended) { v.pause(); return end(); }
        v.requestVideoFrameCallback ? v.requestVideoFrameCallback(onFrame) : requestAnimationFrame(() => onFrame(0, null));
      };
      v.onended = () => setTimeout(end, 50);
      v.play().then(() => onFrame(0, null), e => { finished = true; clearInterval(watch); rej(e); });
    });
    await venc.flush();
    if (err) throw err;
    if (!n) return null;
    if (acfg) {
      const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => err = e });
      aenc.configure(acfg);
      const total = Math.min(audio.length, Math.floor(Math.min(limit, last + 0.05) * 48000)), step = 4800;
      for (let off = 0; off < total && !err; off += step) {
        const k = Math.min(step, total - off), data = new Float32Array(k * ch);

        const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: k, numberOfChannels: ch, timestamp: Math.round(off / 48 * 1000), data });
        aenc.encode(ad); ad.close();
      }
      await aenc.flush();
      if (err) throw err;
    }
    muxer.finalize();
    return new Blob([target.buffer], { type: 'video/mp4' });
  } finally {
    v.pause(); v.removeAttribute('src'); v.load();
    URL.revokeObjectURL(url);
  }
}
// 備用：MediaRecorder 錄成 MP4（Safari 等不支援 WebCodecs 音訊時）
function seVideoMime() {
  if (typeof MediaRecorder === 'undefined') return '';
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}
async function seRecordVideo(fr, blob, onTick, ac) {
  const mime = seVideoMime();
  if (!mime) return null;
  await seLoadFonts(fr.layers);
  const url = URL.createObjectURL(blob), v = document.createElement('video');
  v.src = url; v.playsInline = true;
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('影片讀不出來')); setTimeout(() => rej(new Error('影片讀不出來（逾時）')), 15000); });
  const c = document.createElement('canvas'); c.width = SW; c.height = SH;
  const g = c.getContext('2d');
  const stream = c.captureStream(30);
  // 聲音：接到錄影裡，不從喇叭播出來（AudioContext 要在按下按鈕的當下建立，不然會被暫停、影片卡住）
  if (ac) await ac.resume().catch(() => {});
  if (ac?.state === 'running') {
    const dest = ac.createMediaStreamDestination();
    ac.createMediaElementSource(v).connect(dest);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  } else v.muted = true;
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  const limit = Math.min(isFinite(v.duration) && v.duration > 0 ? v.duration : SE_LIMIT, SE_LIMIT);
  let stopped = false;
  const stop = () => { if (stopped) return; stopped = true; v.pause(); rec.state !== 'inactive' && rec.stop(); };
  const draw = () => {
    if (stopped) return;
    seDrawFrame(g, fr, v, v.videoWidth, v.videoHeight, null);
    onTick?.(Math.min(v.currentTime, limit), limit);
    if (v.currentTime >= limit || v.ended) { stop(); return; }
    v.requestVideoFrameCallback ? v.requestVideoFrameCallback(draw) : requestAnimationFrame(draw);
  };
  v.onended = stop;
  let lastT = -1, moved = Date.now();
  const watch = setInterval(() => {
    if (stopped) return clearInterval(watch);
    if (v.currentTime !== lastT) { lastT = v.currentTime; moved = Date.now(); }
    else if (Date.now() - moved > 10000) { clearInterval(watch); stop(); }
  }, 1000);
  seDrawFrame(g, fr, v, v.videoWidth, v.videoHeight, null);
  rec.start(1000);
  try { await v.play(); } catch { v.muted = true; await v.play(); }
  draw();
  await done;
  URL.revokeObjectURL(url);
  const out = new Blob(chunks, { type: 'video/mp4' });
  return await seVideoOk(out) ? out : null;
}
// 有些電腦說支援 MP4 錄影，實際錄出來是空的：讀讀看確認是好的影片
async function seVideoOk(b) {
  if (!b || b.size < 1000) return false;
  const u = URL.createObjectURL(b), v = document.createElement('video');
  v.muted = true; v.src = u;
  const ok = await new Promise(r => { v.onloadedmetadata = () => r(v.videoWidth > 0); v.onerror = () => r(false); setTimeout(() => r(false), 5000); });
  URL.revokeObjectURL(u);
  return ok;
}
async function seExportVideo(fr, blob, onTick, ac) {
  try { const b = await seEncodeVideo(fr, blob, onTick); if (b) return b; logRemote('trace', '影片：WebCodecs 不支援'); }
  catch (e) { console.warn('WebCodecs 失敗，改用錄影', e); logRemote('trace', '影片：WebCodecs 失敗 ' + (e?.message || e)); }
  const r = await seRecordVideo(fr, blob, onTick, ac).catch(e => { console.warn('錄影失敗', e); logRemote('trace', '影片：錄影失敗 ' + (e?.message || e)); return null; });
  if (!r) logRemote('trace', '影片：兩種方法都不行，用原檔');
  return r;
}
// 輸出全部檔案；存進瀏覽器，半自動發送時直接拿來分享／下載
async function seExportAll(p, onMsg, ac) {
  const se = storyEdit(p), out = [];
  let warned = false;
  for (const [i, m] of p.media.entries()) {
    const blob = await mediaBlob(m);
    if (!blob) throw new Error(`找不到「${m.name}」，請重新加入`);
    const fr = se.frames[m.id];
    let b;
    if (!isVideo(m)) { onMsg?.(`產生第 ${i + 1} 張⋯`); b = await seExportImage(fr, blob); }
    else {
      b = await seExportVideo(fr, blob, (t, total) => onMsg?.(`影片處理中 ${Math.floor(t)}／${Math.ceil(total)} 秒，請不要切換分頁⋯`), ac);
      if (!b) {
        if (blob.size > 25 * 1024 * 1024) throw new Error(`「${m.name}」沒辦法加字，原檔又超過 25MB（${(blob.size / 1048576).toFixed(0)}MB）。請先用手機把影片壓縮、剪短，或改用 MP4（H.264）格式再加入。`);
        b = blob;
        if (!warned) { warned = true; toast('這部影片沒辦法加字，會用原本的影片'); }
      }
    }
    out.push(b);
  }
  return out;
}
// 半自動用：讀取編好的限動檔案；沒編輯過就回傳 null（用原檔）
const storyOut = {};
async function storyFiles(p) {
  if (!p.storyEdit?.done) return null;
  const key = p.id + ':' + p.storyEdit.ver + ':' + p.media.map(m => m.id).join(',');
  if (storyOut[key]) return storyOut[key];
  const saved = dbOk ? await DB.get('kv', 'storyOut:' + p.id).catch(() => null) : null;
  let blobs = saved && saved.key === key ? saved.blobs : null;
  if (!blobs) blobs = await seExportAll(p);
  const files = blobs.map((b, i) => {
    const m = p.media[i], vid = /^video\//.test(b.type);
    return new File([b], m.name.replace(/\.[^.]+$/, '') + '-限動' + (vid ? (/mp4/.test(b.type) ? '.mp4' : '.' + (m.name.split('.').pop() || 'mp4')) : '.jpg'), { type: b.type || m.type });
  });
  storyOut[key] = files;
  return files;
}
async function seFinish() {
  const ctx = seCtx, { p, opts } = ctx;
  const busy = $('#seBusy'), ok = $('#seOk');
  const ac = p.media.some(isVideo) && window.AudioContext ? new AudioContext() : null;

  const t0 = Date.now();
  logRemote('trace', '按了確認，開始處理 ' + mediaInfo(p) + ' ' + p.media.map(m => blobs[m.id] ? (blobs[m.id].size / 1048576).toFixed(1) + 'MB' : '?').join(','));
  busy.scrollIntoView({ block: 'nearest' });
  seStopVideo(ctx);
  try {
    const blobs = await seExportAll(p, msg => { if (seCtx === ctx) busy.textContent = msg; }, ac).finally(() => ac?.close().catch(() => {}));
    logRemote('trace', `處理完成 ${Math.round((Date.now() - t0) / 1000)} 秒，輸出 ${blobs.map(b => (b.type || '?') + ' ' + (b.size / 1048576).toFixed(1) + 'MB').join(',')}`);
    if (seCtx !== ctx) return;
    const key = p.id + ':' + p.storyEdit.ver + ':' + p.media.map(m => m.id).join(',');
    if (dbOk) await DB.put('kv', 'storyOut:' + p.id, { key, blobs }).catch(() => {});
    p.storyEdit.done = true; save();
    delete storyOut[key];
    if (opts) {
      const okSent = await sendAuto(p, opts, blobs, msg => { if (seCtx === ctx) busy.textContent = msg; });
      if (okSent) closeStoryEditor();
      else if (seCtx === ctx) { ok.disabled = false; busy.hidden = true; seLoadSource(); }
    } else { closeStoryEditor(); toast('限動畫面已存好，發 IG／FB 限動時會用編好的版本'); }
  } catch (e) {
    logRemote('storyExport', e.message);
    if (seCtx === ctx) { ok.disabled = false; busy.hidden = true; seLoadSource(); }
    alert('⚠️ 限動畫面產生失敗\n\n原因：' + e.message);
  }
}

async function shrinkImage(blob, max, q = 0.85) {

  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);

// 一行一行斷字（中文逐字、英文數字盡量不拆開）
function wrapLines(g, text, maxW) {
  const lines = [];
  for (const para of String(text).split('\n')) {
    const tokens = para.match(/[A-Za-z0-9.,:/%$&@'’\-+()]+|\s+|./gu) || [''];
    let line = '';
    for (const t of tokens) {
      // 標點不放在行首，寧可這行稍微超出一點
      if (line && g.measureText(line + t).width > maxW && !/^[，。！？、；：」』）)…,.!?~～]/.test(t)) { lines.push(line.trimEnd()); line = t.trimStart(); }
      else line += t;
    }
    lines.push(line);
  }
  return lines;
}
const STORY_FONT = '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
async function drawFsFrame(fr, theme, photo) {
  const W = 1080, H = 1920;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const t = FS_THEMES.find(x => x[0] === theme) || FS_THEMES[0];
  let fg = t[3] || '#fff', accent = t[4] || '#f5c46b';
  if (theme === 'photo' && photo) {
    const bmp = await createImageBitmap(photo);
    const cover = Math.max(W / bmp.width, H / bmp.height);
    g.drawImage(bmp, (W - bmp.width * cover) / 2, (H - bmp.height * cover) / 2, bmp.width * cover, bmp.height * cover);
    const sh = g.createLinearGradient(0, 0, 0, H);
    sh.addColorStop(0, 'rgba(0,0,0,.25)'); sh.addColorStop(.45, 'rgba(0,0,0,.55)'); sh.addColorStop(1, 'rgba(0,0,0,.8)');
    g.fillStyle = sh; g.fillRect(0, 0, W, H);
    fg = '#fff'; accent = '#f5c46b';
  } else {
    const [a, b] = (t[2] || FS_THEMES[0][2]);
    const bg = g.createLinearGradient(0, 0, W * 0.4, H);
    bg.addColorStop(0, a); bg.addColorStop(1, b);
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.globalAlpha = .08; g.fillStyle = fg;   // 角落的圓點裝飾
    g.beginPath(); g.arc(W - 120, 330, 260, 0, 7); g.fill();
    g.beginPath(); g.arc(90, H - 360, 200, 0, 7); g.fill();
    g.globalAlpha = 1;
  }
  const maxW = W - 160;
  g.font = `bold 104px ${STORY_FONT}`;
  const tl = wrapLines(g, fr.title || '', maxW).slice(0, 4);
  g.font = `64px ${STORY_FONT}`;
  const bl = wrapLines(g, fr.body || '', maxW).slice(0, 9);
  const tH = tl.length * 134, gap = tl.length && bl.length ? 96 : 0, bH = bl.length * 96;
  // 文字放在畫面中間偏上，避開 IG 上方頭像和下方回覆框
  let y = Math.max(300, Math.min(H - 380 - (tH + gap + bH), (H - (tH + gap + bH)) / 2 - 60));
  g.textAlign = 'center'; g.textBaseline = 'top'; g.fillStyle = fg;
  if (theme === 'photo') { g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 16; }
  g.font = `bold 104px ${STORY_FONT}`;
  tl.forEach((l, i) => g.fillText(l, W / 2, y + i * 134));
  y += tH;
  if (gap) { g.shadowBlur = 0; g.fillStyle = accent; g.fillRect(W / 2 - 60, y + 40, 120, 10); g.fillStyle = fg; if (theme === 'photo') g.shadowBlur = 16; }
  y += gap;
  g.font = `64px ${STORY_FONT}`;
  bl.forEach((l, i) => g.fillText(l, W / 2, y + i * 96));
  g.shadowBlur = 0;
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}
async function drawFsFrames() {
